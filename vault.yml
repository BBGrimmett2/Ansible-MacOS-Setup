# =============================================================================
# Ansible Vault - Secret Storage Template
# =============================================================================
# IMPORTANT: This file contains PLACEHOLDER values only!
#
# Before using:
#   1. Replace placeholder values with your actual secrets
#   2. Encrypt this file: ansible-vault encrypt vault.yml
#   3. NEVER commit unencrypted secrets to version control
#
# To edit encrypted vault:
#   ansible-vault edit vault.yml
#
# To run playbooks with vault:
#   ansible-playbook playbooks/configure_aap.yml -e @vault.yml --ask-vault-pass
#   ansible-playbook playbooks/configure_aap.yml -e @vault.yml --vault-password-file .vault_pass
#
# NOTE: Most secrets in this project are managed via Dashlane CLI, not this vault.
#       This vault is primarily for AAP and other service-specific credentials.
# =============================================================================

# --- AAP Configuration (Work Profile Only) ---
# Only needed if you plan to use the configure_aap playbook
vault_aap_hostname: "aap-controller.example.com"  # Replace with actual AAP hostname
vault_aap_token: "REDACTED_AAP_TOKEN"              # Replace with actual AAP token

# --- Other Project Secrets ---
# Add additional vault variables as needed for your specific use case
