---
# =============================================================================
# Cloud CLI Role - Validation Tasks
# =============================================================================
# Validates prerequisites before installing cloud CLIs
# =============================================================================

- name: Validate Homebrew is installed
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/brew"
  register: cloud_cli_brew_binary
  failed_when: not cloud_cli_brew_binary.stat.exists
  vars:
    homebrew_prefix: >-
      {{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else
      '/usr/local' }}

- name: Validate macOS platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "This role is designed for macOS only"
    quiet: true
