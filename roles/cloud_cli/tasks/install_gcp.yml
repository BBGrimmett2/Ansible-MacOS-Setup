---
# =============================================================================
# Cloud CLI Role - Install GCP CLI (Public Function)
# =============================================================================
# Installs Google Cloud SDK (gcloud)
# =============================================================================

- name: Check if Google Cloud SDK is installed
  ansible.builtin.stat:
    path: /usr/local/Caskroom/google-cloud-sdk
  register: cloud_cli_gcp_check

- name: Install Google Cloud SDK via Homebrew
  ansible.builtin.command: brew install --cask google-cloud-sdk
  when:
    - cloud_cli_state == 'present'
    - cloud_cli_gcp_enabled | default(true)
    - not cloud_cli_gcp_check.stat.exists
  register: cloud_cli_gcp_install
  changed_when: cloud_cli_gcp_install.rc == 0
