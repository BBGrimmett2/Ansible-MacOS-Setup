---
# =============================================================================
# Cloud CLI Role - Install GCP CLI (Public Function)
# =============================================================================
# Installs Google Cloud SDK (gcloud)
# =============================================================================

- name: Check whether Google Cloud CLI cask is installed
  ansible.builtin.command:
    argv:
      - "{{ homebrew_bin }}"
      - list
      - --cask
      - "{{ cloud_cli_packages.gcp }}"
  register: cloud_cli_gcp_check
  changed_when: false
  failed_when: false

- name: Install Google Cloud CLI via Homebrew
  ansible.builtin.command:
    argv:
      - "{{ homebrew_bin }}"
      - install
      - --cask
      - "{{ cloud_cli_packages.gcp }}"
  when:
    - cloud_cli_state == 'present'
    - cloud_cli_gcp_enabled | default(true)
    - cloud_cli_gcp_check.rc != 0
  register: cloud_cli_gcp_install
  changed_when: cloud_cli_gcp_install.rc == 0
