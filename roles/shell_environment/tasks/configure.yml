---
# =============================================================================
# Shell Environment Role - Configuration Tasks
# =============================================================================
# Deploys ZSH configuration
# =============================================================================

- name: Backup existing .zshrc
  ansible.builtin.copy:
    src: "{{ shell_environment_zshrc_path }}"
    dest: "{{ shell_environment_zshrc_path }}.backup.{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: "0644"
  when:
    - shell_environment_backup_existing
    - shell_environment_zshrc_path is exists
  failed_when: false

- name: Deploy .zshrc configuration
  ansible.builtin.template:
    src: zshrc.j2
    dest: "{{ shell_environment_zshrc_path }}"
    mode: "0644"
    backup: false

- name: Ensure ZSH is default shell
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    shell: /bin/zsh
  become: true
  when: ansible_env.SHELL != '/bin/zsh'

- name: Display shell configuration info
  ansible.builtin.debug:
    msg:
      - "ZSH configuration deployed successfully"
      - "Configuration file: {{ shell_environment_zshrc_path }}"
      - "Profile: {{ workstation_profile | default('personal') }}"
      - ""
      - "Reload with: source ~/.zshrc"
      - "Or open a new terminal"
