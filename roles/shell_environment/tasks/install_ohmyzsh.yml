---
# =============================================================================
# Shell Environment Role - Install Oh-My-Zsh
# =============================================================================
# Installs Oh-My-Zsh framework for ZSH configuration
# =============================================================================

- name: Check if Oh-My-Zsh is already installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.oh-my-zsh"
  register: shell_environment_ohmyzsh_check

- name: Install Oh-My-Zsh
  ansible.builtin.shell: |
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  args:
    creates: "{{ ansible_env.HOME }}/.oh-my-zsh"
  when: not shell_environment_ohmyzsh_check.stat.exists

- name: Display Oh-My-Zsh installation status
  ansible.builtin.debug:
    msg: "Oh-My-Zsh {{ 'already installed' if shell_environment_ohmyzsh_check.stat.exists else 'has been installed' }}"
