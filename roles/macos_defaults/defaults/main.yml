---
# =============================================================================
# macOS Defaults Role - Default Variables
# =============================================================================
# Configure macOS system preferences via the defaults command.
# =============================================================================

# -----------------------------------------------------------------------------
# Dock Settings
# -----------------------------------------------------------------------------

# Application tiles are fully managed after app installation by manage_dock.yml.
# The per-profile lists live in inventories/group_vars/profiles/*.yml.
macos_defaults_dock_apps: "{{ macos_dock_apps | default([]) }}"
macos_defaults_dock_manage_apps: "{{ macos_dock_manage_apps | default(true) }}"

# Automatically hide and show the Dock
macos_defaults_dock_autohide: "{{ macos_dock_autohide | default(true) }}"

# Dock position on screen (bottom, left, right)
macos_defaults_dock_position: "{{ macos_dock_position | default('bottom') }}"

# Icon size of Dock items (16-128)
macos_defaults_dock_tilesize: "{{ macos_dock_tilesize | default(48) }}"

# Magnification of Dock items on hover
macos_defaults_dock_magnification: >-
  {{ macos_dock_magnification | default(false) }}

# Magnification size (if enabled, 16-128)
macos_defaults_dock_largesize: "{{ macos_dock_largesize | default(64) }}"

# Minimize windows using (genie, scale)
macos_defaults_dock_mineffect: "{{ macos_dock_mineffect | default('genie') }}"

# Show recent applications in Dock
macos_defaults_dock_show_recents: >-
  {{ macos_dock_show_recents | default(false) }}

# Show indicators for open applications (dots under running apps)
macos_defaults_dock_show_indicators: >-
  {{ macos_dock_show_indicators | default(false) }}

# Automatically rearrange Spaces based on most recent use
macos_defaults_dock_mru_spaces: "{{ macos_dock_mru_spaces | default(false) }}"

# -----------------------------------------------------------------------------
# Finder Settings
# -----------------------------------------------------------------------------

# Show hidden files in Finder
macos_defaults_finder_show_hidden_files: >-
  {{ macos_finder_show_hidden_files | default(true) }}

# Show all filename extensions
macos_defaults_finder_show_extensions: >-
  {{ macos_finder_show_extensions | default(true) }}

# Show path bar at bottom of Finder windows
macos_defaults_finder_show_path_bar: >-
  {{ macos_finder_show_path_bar | default(true) }}

# Show status bar at bottom of Finder windows
macos_defaults_finder_show_status_bar: >-
  {{ macos_finder_show_status_bar | default(true) }}

# Default Finder view style (icnv=icon, Nlsv=list, clmv=column, Flwv=gallery)
macos_defaults_finder_default_view: >-
  {{ macos_finder_default_view | default('clmv') }}

# Search scope (SCcf=current folder, SCsp=this mac, SCev=previous search scope)
macos_defaults_finder_search_scope: >-
  {{ macos_finder_search_scope | default('SCcf') }}

# Show warning before changing an extension
macos_defaults_finder_warn_on_extension_change: >-
  {{ macos_finder_warn_on_extension_change | default(false) }}

# Show warning before emptying the Trash
macos_defaults_finder_warn_on_empty_trash: >-
  {{ macos_finder_warn_on_empty_trash | default(false) }}

# -----------------------------------------------------------------------------
# Keyboard Settings
# -----------------------------------------------------------------------------

# Key repeat rate (1 = slow, 2 = fast)
macos_defaults_keyboard_key_repeat: >-
  {{ macos_keyboard_key_repeat | default(2) }}

# Delay until key repeat (15 = long, 1 = short)
macos_defaults_keyboard_initial_key_repeat: >-
  {{ macos_keyboard_initial_key_repeat | default(15) }}

# Enable press-and-hold for special characters
macos_defaults_keyboard_press_and_hold: >-
  {{ macos_keyboard_press_and_hold | default(false) }}

# -----------------------------------------------------------------------------
# Trackpad Settings
# -----------------------------------------------------------------------------

# Enable tap to click
macos_defaults_trackpad_tap_to_click: >-
  {{ macos_trackpad_tap_to_click | default(true) }}

# Tracking speed (0.0 = slow, 3.0 = fast)
macos_defaults_trackpad_tracking_speed: >-
  {{ macos_trackpad_tracking_speed | default(1.5) }}

# Enable natural scrolling (true = content tracks finger movement)
macos_defaults_trackpad_natural_scrolling: >-
  {{ macos_trackpad_natural_scrolling | default(true) }}

# -----------------------------------------------------------------------------
# Screenshots
# -----------------------------------------------------------------------------

# Screenshot save location
macos_defaults_screenshots_location: >-
  {{ macos_screenshots_location |
  default(macos_defaults_screenshots_location_default) }}
macos_defaults_screenshots_location_default: >-
  {{ ansible_facts['env']['HOME'] }}/Desktop

# Screenshot file format (png, jpg, gif, pdf, tiff)
macos_defaults_screenshots_format: >-
  {{ macos_screenshots_format | default('png') }}

# Include date/time in screenshot filename
macos_defaults_screenshots_include_date: >-
  {{ macos_screenshots_include_date | default(true) }}

# Disable shadow in screenshots
macos_defaults_screenshots_disable_shadow: >-
  {{ macos_screenshots_disable_shadow | default(false) }}

# -----------------------------------------------------------------------------
# Other System Settings
# -----------------------------------------------------------------------------

# Expand save panel by default
macos_defaults_expand_save_panel: >-
  {{ macos_expand_save_panel | default(true) }}

# Expand print panel by default
macos_defaults_expand_print_panel: >-
  {{ macos_expand_print_panel | default(true) }}

# Disable automatic capitalization
macos_defaults_disable_auto_capitalize: >-
  {{ macos_disable_auto_capitalize | default(false) }}

# Disable automatic period substitution
macos_defaults_disable_auto_period: >-
  {{ macos_disable_auto_period | default(false) }}

# Disable smart quotes
macos_defaults_disable_smart_quotes: >-
  {{ macos_disable_smart_quotes | default(false) }}

# Disable smart dashes
macos_defaults_disable_smart_dashes: >-
  {{ macos_disable_smart_dashes | default(false) }}

# Show battery percentage in menu bar
macos_defaults_show_battery_percentage: >-
  {{ macos_show_battery_percentage | default(true) }}

# Require password after sleep or screen saver (in seconds, 0 = immediately)
macos_defaults_require_password_delay: >-
  {{ macos_require_password_delay | default(5) }}

# -----------------------------------------------------------------------------
# File Associations
# -----------------------------------------------------------------------------

# Configure default applications for file types
macos_defaults_file_associations_enabled: >-
  {{ macos_file_associations_enabled | default(true) }}

# File type associations
# Format: extension -> bundle ID
# Note: Only includes file types that macOS recognizes and VSCode supports
macos_defaults_file_associations: >-
  {{ macos_file_associations | default(macos_defaults_file_associations_default)
  }}
macos_defaults_file_associations_default:
  # Documentation
  md: com.microsoft.VSCode
  txt: com.microsoft.VSCode
  # Configuration files
  yaml: com.microsoft.VSCode
  yml: com.microsoft.VSCode
  json: com.microsoft.VSCode
  # Python
  py: com.microsoft.VSCode
  # JavaScript/TypeScript
  js: com.microsoft.VSCode
  ts: com.microsoft.VSCode
  # Shell scripts
  sh: com.microsoft.VSCode
  bash: com.microsoft.VSCode
  zsh: com.microsoft.VSCode
  # C/C++
  c: com.microsoft.VSCode
  cpp: com.microsoft.VSCode
  h: com.microsoft.VSCode
  # Other languages
  java: com.microsoft.VSCode
  rb: com.microsoft.VSCode
  # Logs
  log: com.microsoft.VSCode

# -----------------------------------------------------------------------------
# Application Control
# -----------------------------------------------------------------------------

# Whether to restart affected applications after changes
macos_defaults_restart_affected_apps: >-
  {{ macos_restart_affected_apps | default(true) }}

# List of applications to restart (if macos_defaults_restart_affected_apps is
# true)
macos_defaults_apps_to_restart: >-
  {{ macos_apps_to_restart | default(macos_defaults_apps_to_restart_default) }}
macos_defaults_apps_to_restart_default:
  - Finder
  - Dock
  - SystemUIServer
