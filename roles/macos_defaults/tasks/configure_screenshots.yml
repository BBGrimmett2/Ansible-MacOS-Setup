---
# =============================================================================
# macOS Defaults Role - Configure Screenshots
# =============================================================================
# Public function: Configure screenshot preferences.
# Can be called via: tasks_from: configure_screenshots
# =============================================================================

- name: Ensure screenshot location exists
  ansible.builtin.file:
    path: "{{ macos_screenshots_location }}"
    state: directory
    mode: '0755'

- name: Set screenshot save location
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: location
    type: string
    value: "{{ macos_screenshots_location }}"
  notify: Restart SystemUIServer

- name: Set screenshot file format
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: type
    type: string
    value: "{{ macos_screenshots_format }}"
  notify: Restart SystemUIServer

- name: Set screenshot include date in filename
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: include-date
    type: bool
    value: "{{ macos_screenshots_include_date }}"
  notify: Restart SystemUIServer

- name: Disable screenshot shadow
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: disable-shadow
    type: bool
    value: "{{ macos_screenshots_disable_shadow }}"
  notify: Restart SystemUIServer

- name: Display screenshot configuration status
  ansible.builtin.debug:
    msg: "Screenshot configuration completed (location: {{ macos_screenshots_location }})"
