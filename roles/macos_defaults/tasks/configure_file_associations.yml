---
# Configure default file handlers only after target apps are installed.
# Reapplying a handler on every run can trigger repeated macOS confirmation
# dialogs.

- name: Check if duti is installed
  ansible.builtin.command: brew list --formula duti
  register: macos_defaults_duti_check
  changed_when: false
  failed_when: false
  when: macos_defaults_file_associations_enabled | bool

- name: Install duti for file associations
  community.general.homebrew:
    name: duti
    state: present
  when:
    - macos_defaults_file_associations_enabled | bool
    - macos_defaults_duti_check.rc != 0

- name: Read current default application for each file extension
  ansible.builtin.command:
    argv:
      - duti
      - -x
      - "{{ item.key }}"
  loop: "{{ macos_defaults_file_associations | dict2items }}"
  register: macos_defaults_file_association_current
  changed_when: false
  failed_when: false
  when:
    - macos_defaults_file_associations_enabled | bool
    - macos_defaults_file_associations | length > 0
  loop_control:
    label: ".{{ item.key }}"

- name: Set default application only when different
  ansible.builtin.command:
    argv:
      - duti
      - -s
      - "{{ item.item.value }}"
      - ".{{ item.item.key }}"
      - all
  loop: "{{ macos_defaults_file_association_current.results | default([]) }}"
  when:
    - not (item.skipped | default(false))
    - >-
      item.rc != 0 or (item.stdout_lines | default([]) | last | default('') |
      trim) != item.item.value
  loop_control:
    label: ".{{ item.item.key }} -> {{ item.item.value }}"

- name: Display file association status
  ansible.builtin.debug:
    msg: >-
      Verified {{ macos_defaults_file_associations | length }} file
      associations; changed only mismatched handlers
  when:
    - macos_defaults_file_associations_enabled | bool
    - macos_defaults_file_associations | length > 0
