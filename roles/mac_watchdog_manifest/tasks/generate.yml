---
- name: Validate manifest inputs for standalone generation
  ansible.builtin.import_tasks: validate.yml

- name: Select Homebrew packages configured by Ansible roles
  ansible.builtin.set_fact:
    mac_watchdog_manifest_selected: >-
      {{ mac_watchdog_manifest_repo_root | watchdog_role_packages }}
  changed_when: false
  no_log: true

- name: Prepare validated expected-state data
  ansible.builtin.set_fact:
    mac_watchdog_manifest_document: >-
      {{ mac_watchdog_manifest_formulae_common | watchdog_manifest(
           mac_watchdog_manifest_formulae_extra,
           mac_watchdog_manifest_resources,
           mac_watchdog_manifest_selected) }}
  changed_when: false
  no_log: true

- name: Create private expected-state directory
  ansible.builtin.file:
    path: "{{ mac_watchdog_manifest_path | dirname }}"
    state: directory
    mode: '0700'

- name: Write private expected-state manifest only when content changes
  ansible.builtin.copy:
    content: "{{ mac_watchdog_manifest_document | to_nice_json(indent=2) }}\n"
    dest: "{{ mac_watchdog_manifest_path }}"
    mode: '0600'
