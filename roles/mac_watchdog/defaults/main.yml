---
mac_watchdog_enabled: true
mac_watchdog_repo: https://github.com/BBGrimmett2/MacOS-Config-Watchdog.git
# Pin installs to a reviewed commit; changes require an explicit Ansible PR.
mac_watchdog_revision: a342d2e9b675bb4b85eb9459e72d840bf124788b
mac_watchdog_python_executable: /opt/homebrew/bin/python3
mac_watchdog_home: "{{ ansible_facts['env']['HOME'] }}"
mac_watchdog_install_root: "{{ mac_watchdog_home }}/.local/share/mac-watchdog"
mac_watchdog_source_dir: "{{ mac_watchdog_install_root }}/source"
mac_watchdog_venv_dir: "{{ mac_watchdog_install_root }}/venv"
mac_watchdog_launchagent_label: icu.starbase.mac-watchdog
mac_watchdog_launchagent_path: "{{ mac_watchdog_home }}/Library/LaunchAgents/{{ mac_watchdog_launchagent_label }}.plist"
