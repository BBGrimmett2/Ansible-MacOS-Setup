---
# =============================================================================
# Database Tools Role - Install pgAdmin (Public Function)
# =============================================================================
# Installs pgAdmin PostgreSQL management tool
# =============================================================================

- name: Check if pgAdmin is installed
  ansible.builtin.command: brew list --cask pgadmin4
  register: database_tools_pgadmin_check
  changed_when: false
  failed_when: false

- name: Install pgAdmin via Homebrew
  ansible.builtin.command: brew install --cask pgadmin4
  when:
    - database_tools_state == 'present'
    - database_tools_pgadmin_check.rc != 0
  register: database_tools_pgadmin_install
  changed_when: database_tools_pgadmin_install.rc == 0
