---
# =============================================================================
# Development Tools Role - Install Claude Code CLI (Work Profile)
# =============================================================================
# Installs and configures Claude Code CLI for the work profile.
# - Work Profile: Red Hat Vertex AI integration via Google Cloud
# =============================================================================

# -----------------------------------------------------------------------------
# WORK PROFILE: Red Hat Vertex AI Setup
# -----------------------------------------------------------------------------

- name: Check if Claude Code is installed
  ansible.builtin.command: which claude
  register: claude_check
  changed_when: false
  failed_when: false

- name: Install Claude Code CLI
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  when: claude_check.rc != 0
  changed_when: true

- name: Check if Claude Code Vertex AI is already configured
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/claude-code-vertex/env.sh"
  register: claude_vertex_configured

- name: Display skip message
  ansible.builtin.debug:
    msg: "Claude Code Vertex AI already configured - skipping setup"
  when: claude_vertex_configured.stat.exists

- name: Prompt to connect to Red Hat VPN
  ansible.builtin.pause:
    prompt: |

      ================================================
      Claude Code Setup - VPN Required
      ================================================

      Claude Code setup requires connection to Red Hat VPN.

      ACTION REQUIRED:
      1. Open Viscosity
      2. Connect to "Red Hat Global VPN" profile
      3. Wait for connection to establish

      Press ENTER when connected to VPN to continue...
      ================================================
  when: not claude_vertex_configured.stat.exists

- name: Fetch GCP Project ID from Dashlane
  ansible.builtin.include_role:
    name: dashlane_secrets
    tasks_from: fetch_secret
  vars:
    dashlane_secret_name: "claude_code_gcp_project_id"
  when: not claude_vertex_configured.stat.exists

- name: Display Claude Code configuration prompt
  ansible.builtin.debug:
    msg:
      - "================================================"
      - "Claude Code - Vertex AI Setup (Red Hat)"
      - "================================================"
      - "This will configure Claude Code with Google Cloud Vertex AI"
      - "You will be prompted to authenticate with your Google account"
      - "in a browser window."
      - ""
      - "GCP Project: {{ dashlane_secret_value if dashlane_secret_retrieved else 'Not configured' }}"
      - "================================================"
  when: not claude_vertex_configured.stat.exists

- name: Install and configure Claude Code with Vertex AI
  ansible.builtin.shell: |
    curl -fsSL "https://red.ht/claude-vertex-linux-setup" | bash -s -- {{ dashlane_secret_value }}
  when: not claude_vertex_configured.stat.exists
  register: claude_vertex_setup
  changed_when: true

- name: Display Claude Code setup completion
  ansible.builtin.debug:
    msg:
      - "Claude Code Vertex AI configuration complete!"
      - "You can now use the 'claude' command with Red Hat's Vertex AI backend"
  when:
    - claude_vertex_setup is defined
    - claude_vertex_setup.changed

- name: Prompt to disconnect from Red Hat VPN
  ansible.builtin.pause:
    prompt: |

      ================================================
      Claude Code Setup Complete
      ================================================

      You may now disconnect from the Red Hat VPN if desired.

      The playbook will continue after you press ENTER.
      ================================================
  when: not claude_vertex_configured.stat.exists
