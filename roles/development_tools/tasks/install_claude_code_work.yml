---
# =============================================================================
# Development Tools Role - Install Claude Code CLI (Work Profile)
# =============================================================================
# Installs and configures Claude Code CLI for the work profile.
# - Work Profile: Red Hat Vertex AI integration via Google Cloud
# =============================================================================

# -----------------------------------------------------------------------------
# WORK PROFILE: Red Hat Vertex AI Setup
# -----------------------------------------------------------------------------

- name: Check if Claude Code is installed
  ansible.builtin.command: which claude
  register: development_tools_claude_check
  changed_when: false
  failed_when: false

- name: Install Claude Code CLI when missing
  when:
    - development_tools_claude_check.rc != 0
    - not ansible_check_mode
  block:
    - name: Download Claude Code installer
      ansible.builtin.uri:
        url: https://claude.ai/install.sh
        return_content: true
      register: development_tools_claude_installer

    # The vendor installer requires Bash. Run it only when Claude is missing.
    - name: Run Claude Code installer
      ansible.builtin.command:
        argv: [bash]
        stdin: "{{ development_tools_claude_installer.content }}"
        stdin_add_newline: false
      changed_when: true

- name: Check if Claude Code Vertex AI is already configured
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/claude-code-vertex/env.sh"
  register: development_tools_claude_vertex_configured

- name: Display skip message
  ansible.builtin.debug:
    msg: "Claude Code Vertex AI already configured - skipping setup"
  when: development_tools_claude_vertex_configured.stat.exists

- name: Prompt to connect to Red Hat VPN
  ansible.builtin.pause:
    prompt: |

      ================================================
      Claude Code Setup - VPN Required
      ================================================

      Claude Code setup requires connection to Red Hat VPN.

      ACTION REQUIRED:
      1. Open Viscosity
      2. Connect to "Red Hat Global VPN" profile
      3. Wait for connection to establish

      Press ENTER when connected to VPN to continue...
      ================================================
  when: not development_tools_claude_vertex_configured.stat.exists

- name: Fetch GCP Project ID from Dashlane
  ansible.builtin.include_role:
    name: dashlane_secrets
    tasks_from: fetch_secret
  vars:
    dashlane_secrets_secret_name: "claude_code_gcp_project_id"
  when: not development_tools_claude_vertex_configured.stat.exists

- name: Display Claude Code configuration prompt
  ansible.builtin.debug:
    msg:
      - "================================================"
      - "Claude Code - Vertex AI Setup (Red Hat)"
      - "================================================"
      - "This will configure Claude Code with Google Cloud Vertex AI"
      - "You will be prompted to authenticate with your Google account"
      - "in a browser window."
      - ""
      - "GCP Project: {{ dashlane_secrets_secret_value if dashlane_secrets_secret_retrieved else 'Not configured' }}"
      - "================================================"
  when: not development_tools_claude_vertex_configured.stat.exists

- name: Install and configure Claude Code with Vertex AI
  when:
    - not development_tools_claude_vertex_configured.stat.exists
    - not ansible_check_mode
  block:
    - name: Download Red Hat Vertex AI setup script
      ansible.builtin.uri:
        url: https://red.ht/claude-vertex-linux-setup
        return_content: true
      register: development_tools_claude_vertex_installer

    # The vendor script requires Bash. The configuration file above guards reruns.
    - name: Run Red Hat Vertex AI setup script
      ansible.builtin.command:
        argv:
          - bash
          - -s
          - --
          - "{{ dashlane_secrets_secret_value }}"
        stdin: "{{ development_tools_claude_vertex_installer.content }}"
        stdin_add_newline: false
        expand_argument_vars: false
      register: development_tools_claude_vertex_setup
      changed_when: true

- name: Display Claude Code setup completion
  ansible.builtin.debug:
    msg:
      - "Claude Code Vertex AI configuration complete!"
      - "You can now use the 'claude' command with Red Hat's Vertex AI backend"
  when:
    - development_tools_claude_vertex_setup is defined
    - development_tools_claude_vertex_setup.changed

- name: Prompt to disconnect from Red Hat VPN
  ansible.builtin.pause:
    prompt: |

      ================================================
      Claude Code Setup Complete
      ================================================

      You may now disconnect from the Red Hat VPN if desired.

      The playbook will continue after you press ENTER.
      ================================================
  when: not development_tools_claude_vertex_configured.stat.exists
