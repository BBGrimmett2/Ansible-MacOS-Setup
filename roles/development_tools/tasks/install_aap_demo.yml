---
# =============================================================================
# Development Tools Role - Install AAP Demo Tools (Public Function)
# =============================================================================
# Installs Ansible Automation Platform demo environment tools
# Note: Opens GitHub repository for manual setup
# =============================================================================

- name: Check aap-demo CLI version
  ansible.builtin.command: aap-demo --version
  register: development_tools_aap_demo_version
  changed_when: false
  failed_when: false

- name: Display aap-demo version
  ansible.builtin.debug:
    msg: "{{ development_tools_aap_demo_version.stdout_lines }}"
  when: development_tools_aap_demo_version.rc == 0

- name: Warn if aap-demo CLI is not installed
  ansible.builtin.debug:
    msg:
      - "aap-demo CLI not found. Install from: {{ development_tools_aap_demo_repo }}"
      - "  git clone {{ development_tools_aap_demo_repo }} {{ development_tools_aap_demo_dir }}"
      - "  cd {{ development_tools_aap_demo_dir }}"
      - "  # Follow README.md for setup"
  when: development_tools_aap_demo_version.rc != 0
