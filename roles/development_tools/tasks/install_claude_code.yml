---
# =============================================================================
# Development Tools Role - Install Claude Code CLI (Public Function)
# =============================================================================
# Routes to profile-specific Claude Code setup
# =============================================================================

- name: Include work profile Claude Code setup
  ansible.builtin.include_tasks: install_claude_code_work.yml
  when: workstation_profile == 'work'

- name: Include personal profile Claude Code setup
  ansible.builtin.include_tasks: install_claude_code_personal.yml
  when: workstation_profile == 'personal'
