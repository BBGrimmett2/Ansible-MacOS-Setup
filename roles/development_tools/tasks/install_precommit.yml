---
# =============================================================================
# Development Tools Role - Install pre-commit (Public Function)
# =============================================================================
# Installs pre-commit git hooks framework
# =============================================================================

- name: Check if pre-commit is installed
  ansible.builtin.command: brew list --formula pre-commit
  register: development_tools_precommit_check
  changed_when: false
  failed_when: false

- name: Install pre-commit via Homebrew
  ansible.builtin.command: brew install pre-commit
  when:
    - development_tools_state == 'present'
    - development_tools_precommit_check.rc != 0
  register: development_tools_precommit_install
  changed_when: development_tools_precommit_install.rc == 0

- name: Check if git template directory is already initialized
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.git-template/hooks/pre-commit"
  register: development_tools_precommit_template_check

- name: Initialize pre-commit git template directory
  ansible.builtin.command: pre-commit init-templatedir "{{ ansible_facts['env']['HOME'] }}/.git-template"
  when: not development_tools_precommit_template_check.stat.exists
  changed_when: true

- name: Configure git to use pre-commit template directory
  community.general.git_config:
    name: init.templateDir
    value: "{{ ansible_facts['env']['HOME'] }}/.git-template"
    scope: global
