---
# Import profile-designated key material when available; never generate keys.
- name: Check GPG availability
  ansible.builtin.command: gpg --version
  register: development_tools_profile_gpg_available
  changed_when: false
  failed_when: false

- name: Fetch profile GPG secret from Dashlane
  ansible.builtin.command:
    argv: ["{{ dashlane_cli | default('dcli') }}", "note", "{{ development_tools_gpg_secret }}", "--output", "text"]
  register: development_tools_profile_gpg_secret
  changed_when: false
  failed_when: false
  no_log: true
  when: development_tools_profile_gpg_available.rc == 0 and development_tools_gpg_secret | length > 0

- name: Determine whether GPG secret is available
  ansible.builtin.set_fact:
    development_tools_profile_gpg_ready: >-
      {{ development_tools_profile_gpg_available.rc == 0
         and (development_tools_profile_gpg_secret.rc | default(1)) == 0
         and 'BEGIN PGP PRIVATE KEY BLOCK' in (development_tools_profile_gpg_secret.stdout | default('')) }}
  no_log: true

- name: Import profile key and configure signing
  when: development_tools_profile_gpg_ready | bool
  block:
    - name: Create private temporary GPG key file
      ansible.builtin.tempfile:
        state: file
        suffix: .asc
      register: development_tools_profile_gpg_temp

    - name: Write GPG key to temporary file
      ansible.builtin.copy:
        content: "{{ development_tools_profile_gpg_secret.stdout | trim }}\n"
        dest: "{{ development_tools_profile_gpg_temp.path }}"
        mode: '0600'
      no_log: true

    - name: Inspect GPG key fingerprint
      ansible.builtin.command:
        argv: [gpg, --batch, --show-keys, --with-colons, --fingerprint, "{{ development_tools_profile_gpg_temp.path }}"]
      register: development_tools_profile_gpg_inspect
      changed_when: false
      no_log: true

    - name: Set GPG signing fingerprint
      ansible.builtin.set_fact:
        development_tools_profile_gpg_fingerprint: "{{ (development_tools_profile_gpg_inspect.stdout | regex_findall('(?m)^fpr:{9}([0-9A-F]+):')) | first }}"
      no_log: true

    - name: Check if private GPG key already installed
      ansible.builtin.command:
        argv: [gpg, --batch, --list-secret-keys, "{{ development_tools_profile_gpg_fingerprint }}"]
      register: development_tools_profile_gpg_existing
      changed_when: false
      failed_when: false
      no_log: true

    - name: Import missing private GPG key
      ansible.builtin.command:
        argv: [gpg, --batch, --import, "{{ development_tools_profile_gpg_temp.path }}"]
      when: development_tools_profile_gpg_existing.rc != 0
      no_log: true

    - name: Verify selected private GPG key is usable after import
      ansible.builtin.command:
        argv: [gpg, --batch, --list-secret-keys, "{{ development_tools_profile_gpg_fingerprint }}"]
      changed_when: false
      no_log: true

    - name: Configure Git GPG signing key
      community.general.git_config:
        name: user.signingkey
        value: "{{ development_tools_profile_gpg_fingerprint }}"
        scope: global

    - name: Enable Git commit GPG signing
      community.general.git_config:
        name: commit.gpgsign
        value: 'true'
        scope: global

    - name: Select GPG signing implementation
      community.general.git_config:
        name: gpg.format
        value: openpgp
        scope: global
  always:
    - name: Remove temporary GPG private key file
      ansible.builtin.file:
        path: "{{ development_tools_profile_gpg_temp.path }}"
        state: absent
      when: (development_tools_profile_gpg_temp | default({})).path is defined
      no_log: true

- name: Record missing GPG prerequisite for final run summary
  ansible.builtin.set_fact:
    development_tools_setup_warnings: >-
      {{ development_tools_setup_warnings | default([])
         + ['GPG key unavailable: profile=' ~ workstation_profile ~ ', Dashlane=' ~ development_tools_gpg_secret
            ~ '. Git commit signing was not changed.'] }}
  when: not development_tools_profile_gpg_ready | bool
