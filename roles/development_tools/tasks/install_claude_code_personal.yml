---
# Personal Claude Code: subscription-based browser authentication, never an API key.
- name: Check Claude Code CLI
  ansible.builtin.command: which claude
  register: personal_claude_check
  changed_when: false
  failed_when: false

- name: Install Claude Code CLI for personal profile
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://claude.ai/install.sh | bash
  args:
    executable: /bin/bash
  when: personal_claude_check.rc != 0
  changed_when: true

- name: Explain personal Claude subscription login
  ansible.builtin.debug:
    msg: "Claude Code installed. Run 'claude' and complete the browser subscription login if not already authenticated. No API key or VPN required."
