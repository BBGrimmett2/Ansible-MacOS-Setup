---
# =============================================================================
# Development Tools Role - Install Claude Code CLI - Personal Profile
# =============================================================================
# Configures Claude Code CLI with direct Anthropic API
# =============================================================================

- name: Check if Claude Code is installed
  ansible.builtin.command: which claude
  register: claude_check
  changed_when: false
  failed_when: false

- name: Display Claude Code installation status
  ansible.builtin.debug:
    msg: "Claude Code CLI {{ 'is installed' if claude_check.rc == 0 else 'not found - install via Homebrew: brew install --cask claude' }}"

