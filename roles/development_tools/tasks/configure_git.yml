---
# Configure Git using only the explicitly selected workstation identity.

- name: Require an explicit profile and Git identity
  ansible.builtin.assert:
    that:
      - workstation_profile is defined
      - workstation_profile in ['personal', 'work']
      - development_tools_git_user_name | trim | length > 0
      - development_tools_git_user_email | trim | length > 0
      - "'@' in development_tools_git_user_email"
    fail_msg: >-
      A valid profile-specific Git name and email are required.
      Supply WORKSTATION_GIT_EMAIL_PERSONAL or WORKSTATION_GIT_EMAIL_WORK.
  when: not development_tools_gitconfig_from_dashlane | bool

- name: Check whether .gitconfig exists
  ansible.builtin.stat:
    path: "{{ development_tools_gitconfig_path }}"
  register: development_tools_gitconfig_stat

- name: Inspect existing Git identity
  ansible.builtin.command:
    argv:
      - git
      - config
      - --file
      - "{{ development_tools_gitconfig_path }}"
      - --get-regexp
      - '^(user\.name|user\.email)$'
  register: development_tools_existing_git_identity
  changed_when: false
  failed_when: false
  when: development_tools_gitconfig_stat.stat.exists

- name: Back up .gitconfig when replacing an existing identity or Dashlane configuration
  ansible.builtin.copy:
    src: "{{ development_tools_gitconfig_path }}"
    dest: "{{ development_tools_gitconfig_path }}.backup.{{ ansible_facts['date_time']['epoch'] }}"
    remote_src: true
    mode: "0600"
  when:
    - development_tools_gitconfig_backup | bool
    - development_tools_gitconfig_stat.stat.exists
    - >-
      development_tools_gitconfig_from_dashlane | bool or
      ('user.name ' ~ development_tools_git_user_name) not in (development_tools_existing_git_identity.stdout_lines | default([])) or
      ('user.email ' ~ development_tools_git_user_email) not in (development_tools_existing_git_identity.stdout_lines | default([]))

- name: Deploy .gitconfig from Dashlane
  when: development_tools_gitconfig_from_dashlane
  block:
    - name: Set Dashlane secret name for .gitconfig
      ansible.builtin.set_fact:
        development_tools_gitconfig_secret_name: >-
          {{ development_tools_gitconfig_dashlane_secret_personal if workstation_profile == 'personal'
             else development_tools_gitconfig_dashlane_secret_work }}

    - name: Fetch .gitconfig from Dashlane
      ansible.builtin.include_role:
        name: dashlane_secrets
        tasks_from: fetch_file
      vars:
        dashlane_secrets_secret_name: "{{ development_tools_gitconfig_secret_name }}"
        dashlane_secrets_secret_output_path: "{{ development_tools_gitconfig_path }}"
        dashlane_secrets_secret_permissions: "0644"

    - name: Display .gitconfig deployment status
      ansible.builtin.debug:
        msg:
          - "Git configured from Dashlane ({{ development_tools_gitconfig_secret_name }})"
          - "Profile: {{ workstation_profile | default('personal') }}"

- name: Configure git with individual settings
  when: not development_tools_gitconfig_from_dashlane
  block:
    - name: Configure git user name
      community.general.git_config:
        name: user.name
        value: "{{ development_tools_git_user_name }}"
        scope: global

    - name: Configure git user email
      community.general.git_config:
        name: user.email
        value: "{{ development_tools_git_user_email }}"
        scope: global

    - name: Configure git default branch
      community.general.git_config:
        name: init.defaultBranch
        value: "{{ development_tools_git_default_branch }}"
        scope: global

    - name: Configure git editor
      community.general.git_config:
        name: core.editor
        value: "{{ development_tools_git_editor }}"
        scope: global

    - name: Configure git to use delta as pager (if installed)
      community.general.git_config:
        name: core.pager
        value: delta
        scope: global
      when: "'git-delta' in ansible_facts.packages | default({})"
      failed_when: false

    - name: Display git configuration
      ansible.builtin.debug:
        msg:
          - "Git configured successfully"
          - "User: {{ development_tools_git_user_name }} <{{ development_tools_git_user_email }}>"
          - "Default branch: {{ development_tools_git_default_branch }}"
          - "Editor: {{ development_tools_git_editor }}"
