    description: Documented task entry point callable with tasks_from
    options: {}

  install:
    short_description: install operation for development tools
    description: Documented task entry point callable with tasks_from
    options: {}

  install_aap_demo:
    short_description: install aap demo operation for development tools
    description: Documented task entry point callable with tasks_from
    options: {}

  install_claude_code:
