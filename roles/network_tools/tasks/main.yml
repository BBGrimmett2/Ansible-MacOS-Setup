---
# =============================================================================
# Network Tools Role - Main Entry Point
# =============================================================================
# Orchestrates validation and installation of network tools
# =============================================================================

- name: Validate prerequisites
  ansible.builtin.import_tasks: validate.yml
  tags: [always, validate]

- name: Install network tools
  ansible.builtin.import_tasks: install.yml
  tags: [install]
  when: network_tools_state == 'present'

- name: Deploy VPN configurations
  ansible.builtin.import_tasks: deploy_vpn.yml
  when: vpn_profiles | default([]) | length > 0
  tags: [network, vpn]

# Standalone role runs still deploy certificates by default. Bootstrap opts out
# because it deploys trusted CAs earlier, before SSH.
- name: Deploy certificates
  ansible.builtin.import_tasks: deploy_certificates.yml
  when:
    - network_tools_deploy_certificates | default(true) | bool
    - certificates | default([]) | length > 0
  tags: [network, certificates]
