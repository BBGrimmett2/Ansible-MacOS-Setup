---
# =============================================================================
# Network Tools Role - Install nmap (Public Function)
# =============================================================================
# Installs nmap - network scanner
# =============================================================================

- name: Check if nmap is installed
  ansible.builtin.command: brew list --formula nmap
  register: network_tools_nmap_check
  changed_when: false
  failed_when: false

- name: Install nmap via Homebrew
  ansible.builtin.command: brew install nmap
  when:
    - network_tools_state == 'present'
    - network_tools_nmap_check.rc != 0
  register: network_tools_nmap_install
  changed_when: network_tools_nmap_install.rc == 0
