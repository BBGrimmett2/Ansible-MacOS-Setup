---
# =============================================================================
# Network Tools Role - Install OpenVPN (Public Function)
# =============================================================================
# Installs OpenVPN client
# =============================================================================

- name: Check if OpenVPN is installed
  ansible.builtin.command: brew list --formula openvpn
  register: network_tools_openvpn_check
  changed_when: false
  failed_when: false

- name: Install OpenVPN via Homebrew
  ansible.builtin.command: brew install openvpn
  when:
    - network_tools_state == 'present'
    - network_tools_openvpn_check.rc != 0
  register: network_tools_openvpn_install
  changed_when: network_tools_openvpn_install.rc == 0
