---
# OpenVPN CLI is shared by personal and work profiles. Check the installed
# formula before invoking brew: community.general.homebrew can treat Homebrew's
# "already installed and up-to-date" warning as an Ansible failure.

- name: Check installed OpenVPN formula
  ansible.builtin.command:
    argv:
      - brew
      - list
      - --versions
      - "{{ network_tools_packages.openvpn }}"
  register: network_tools_openvpn_installed
  changed_when: false
  failed_when: false
  check_mode: false
  when: network_tools_state == 'present'

- name: Install OpenVPN only when absent
  ansible.builtin.command:
    argv:
      - brew
      - install
      - --no-ask
      - "{{ network_tools_packages.openvpn }}"
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_NO_ASK: "1"
  register: network_tools_openvpn_install
  changed_when: network_tools_openvpn_install.rc == 0
  when:
    - network_tools_state == 'present'
    - network_tools_openvpn_installed.rc != 0
    - not ansible_check_mode

- name: Verify OpenVPN is installed
  ansible.builtin.command:
    argv:
      - brew
      - list
      - --versions
      - "{{ network_tools_packages.openvpn }}"
  register: network_tools_openvpn_verified
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - network_tools_state == 'present'
    - not ansible_check_mode

- name: Require installed OpenVPN formula
  ansible.builtin.assert:
    that:
      - network_tools_openvpn_verified.rc == 0
      - network_tools_openvpn_verified.stdout | trim | length > 0
    fail_msg: "OpenVPN formula is still missing after installation."
  when:
    - network_tools_state == 'present'
    - not ansible_check_mode
