---
# =============================================================================
# Certificate Deployment
# =============================================================================
# Purpose: Deploy and install certificates from Dashlane secrets storage
# Configuration: Defined in inventories/host_vars/localhost.yml (certificates list)
# =============================================================================

- name: Create certificates directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.certs"
    state: directory
    mode: '0755'
  tags: [network, certificates]

- name: Check Google Drive is mounted
  ansible.builtin.stat:
    path: "{{ google_drive_path }}"
  register: google_drive_mount
  tags: [network, certificates]

- name: Fail if Google Drive is not mounted
  ansible.builtin.fail:
    msg: "Google Drive is not mounted at {{ google_drive_path }}. Open the Google Drive app and sign in first."
  when: not google_drive_mount.stat.exists
  tags: [network, certificates]

- name: Fetch certificate paths from Dashlane
  ansible.builtin.shell: |
    dcli note "{{ item.dashlane_secret }}" --output text | tr -d '\n\r'
  register: cert_path_results
  changed_when: false
  loop: "{{ certificates }}"
  when:
    - item.enabled | default(false)
  loop_control:
    label: "{{ item.name }}"
  tags: [network, certificates]

- name: Copy certificates from Google Drive
  ansible.builtin.copy:
    src: "{{ cert_path_results.results[loop_index].stdout | trim }}"
    dest: "{{ item.file }}"
    mode: '0644'
    remote_src: true
  loop: "{{ certificates }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: loop_index
  when:
    - item.enabled | default(false)
    - cert_path_results.results[loop_index].rc == 0
  tags: [network, certificates]

- name: Check if certificates already installed in login keychain
  ansible.builtin.shell: |
    CN=$(openssl x509 -noout -subject -in "{{ item.file }}" | sed 's/.*CN *= *//' | sed 's/[,\/].*//')
    security find-certificate -c "$CN" "${HOME}/Library/Keychains/login.keychain-db"
  register: cert_check
  changed_when: false
  failed_when: false
  loop: "{{ certificates }}"
  when:
    - item.enabled | default(false)
  loop_control:
    label: "{{ item.name }}"
  tags: [network, certificates]

- name: Install certificates to login keychain
  ansible.builtin.command:
    cmd: >
      security add-trusted-cert
      -d -r trustRoot
      -k {{ ansible_facts['env']['HOME'] }}/Library/Keychains/login.keychain-db
      {{ item.item.file }}
  register: cert_install
  changed_when: cert_install.rc == 0
  loop: "{{ cert_check.results }}"
  when:
    - item.item.enabled | default(false)
    - item.rc != 0
  loop_control:
    label: "{{ item.item.name }}"
  tags: [network, certificates]

- name: Display certificate installation status
  ansible.builtin.debug:
    msg: "Certificate '{{ item.item.name }}' {{ 'installed' if item.rc != 0 else 'already present' }} in login keychain"
  loop: "{{ cert_check.results }}"
  when:
    - item.item.enabled | default(false)
  loop_control:
    label: "{{ item.item.name }}"
  tags: [network, certificates]
