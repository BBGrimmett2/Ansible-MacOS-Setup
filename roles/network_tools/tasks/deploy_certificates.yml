---
# =============================================================================
# Certificate Deployment
# =============================================================================
# Purpose: Deploy profile-scoped certificate files from local paths stored in Dashlane.
# The local certificate file can be synced by Nextcloud or placed locally.
# The certificate source must be available when this task runs.
# =============================================================================

- name: Create certificates directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.certs"
    state: directory
    mode: '0755'
  tags: [network, certificates]

- name: Fetch certificate paths from Dashlane
  ansible.builtin.shell: |
    dcli note "{{ item.dashlane_secret }}" --output text | tr -d '\n\r'
  register: cert_path_results
  no_log: true
  changed_when: false
  loop: "{{ certificates }}"
  when:
    - item.enabled | default(false)
    - item.profile is defined
    - item.profile == workstation_profile
  loop_control:
    label: "{{ item.name }}"
  tags: [network, certificates]

- name: Copy certificates from configured local paths
  ansible.builtin.copy:
    src: "{{ cert_path_results.results[loop_index].stdout | trim }}"
    dest: "{{ item.file }}"
    mode: '0644'
    remote_src: true
  loop: "{{ certificates }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: loop_index
  when:
    - item.enabled | default(false)
    - item.profile is defined
    - item.profile == workstation_profile
    - cert_path_results.results[loop_index].rc == 0
  tags: [network, certificates]

- name: Check if certificates already installed in system keychain
  ansible.builtin.shell: |
    CN=$(openssl x509 -noout -subject -in "{{ item.file }}" | sed 's/.*CN *= *//' | sed 's/[,\/].*//')
    security find-certificate -c "$CN" /Library/Keychains/System.keychain
  register: cert_check
  changed_when: false
  failed_when: false
  loop: "{{ certificates }}"
  when:
    - item.enabled | default(false)
    - item.profile is defined
    - item.profile == workstation_profile
  loop_control:
    label: "{{ item.name }}"
  tags: [network, certificates]

- name: Install certificates to system keychain
  ansible.builtin.command:
    cmd: >
      security add-trusted-cert
      -d -r trustRoot
      -k /Library/Keychains/System.keychain
      {{ item.item.file }}
  become: true
  register: cert_install
  changed_when: cert_install.rc == 0
  loop: "{{ cert_check.results }}"
  when:
    - item.item.enabled | default(false)
    - item.item.profile == workstation_profile
    - item.rc != 0
  loop_control:
    label: "{{ item.item.name }}"
  tags: [network, certificates]

- name: Display certificate installation status
  ansible.builtin.debug:
    msg: "Certificate '{{ item.item.name }}' {{ 'installed' if item.rc != 0 else 'already present' }} in system keychain"
  loop: "{{ cert_check.results }}"
  when:
    - item.item.enabled | default(false)
  loop_control:
    label: "{{ item.item.name }}"
  tags: [network, certificates]
