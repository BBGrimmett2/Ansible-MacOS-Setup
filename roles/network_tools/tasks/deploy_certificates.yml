---
# Profile-scoped CA trust anchors; PEM content lives directly in Dashlane.
- name: Reject certificates not designated for selected profile
  ansible.builtin.assert:
    that:
      - item.profile is defined
      - item.profile == workstation_profile
      - item.dashlane_secret is defined
      - item.file is defined
    fail_msg: "CA '{{ item.name }}' has invalid profile or incomplete designation"
  loop: "{{ certificates | selectattr('enabled', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure certificate directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.certs"
    state: directory
    mode: '0755'

- name: Read system keychain certificate identifiers
  ansible.builtin.command:
    argv: [security, find-certificate, -a, -Z, /Library/Keychains/System.keychain]
  register: network_tools_profile_installed_ca_inventory
  changed_when: false

- name: Deploy and validate required profile CA certificates
  ansible.builtin.include_tasks: deploy_certificate_item.yml
  loop: "{{ certificates | selectattr('enabled', 'equalto', true) | list }}"
  loop_control:
    loop_var: cert_item
    label: "{{ cert_item.name }}"
