---
# =============================================================================
# Certificate Deployment
# =============================================================================
# Purpose: Deploy and install certificates from Dashlane secrets storage
# Configuration: Defined in inventories/host_vars/localhost.yml (certificates list)
# =============================================================================

- name: Create certificates directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.certs"
    state: directory
    mode: '0755'
  tags: [network, certificates]

- name: Fetch certificate download URLs from Dashlane
  ansible.builtin.shell: |
    SHARE_URL=$(dcli note "{{ item.dashlane_secret }}" --output text | tr -d '[:space:]')
    FILE_ID=$(echo "$SHARE_URL" | sed 's|.*/file/d/||' | sed 's|/.*||')
    echo "https://drive.google.com/uc?export=download&id=${FILE_ID}"
  register: cert_url_results
  changed_when: false
  loop: "{{ certificates }}"
  when:
    - item.enabled | default(false)
  loop_control:
    label: "{{ item.name }}"
  tags: [network, certificates]

- name: Download certificates from Google Drive
  ansible.builtin.get_url:
    url: "{{ cert_url_results.results[loop_index].stdout | trim }}"
    dest: "{{ item.file }}"
    mode: '0644'
  loop: "{{ certificates }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: loop_index
  when:
    - item.enabled | default(false)
    - cert_url_results.results[loop_index].rc == 0
  tags: [network, certificates]

- name: Check if certificates already installed in system keychain
  ansible.builtin.shell: |
    CN=$(openssl x509 -noout -subject -in "{{ item.file }}" | sed 's/.*CN *= *//' | sed 's/[,\/].*//')
    security find-certificate -c "$CN" /Library/Keychains/System.keychain
  register: cert_check
  changed_when: false
  failed_when: false
  loop: "{{ certificates }}"
  when:
    - item.enabled | default(false)
  loop_control:
    label: "{{ item.name }}"
  tags: [network, certificates]

- name: Install certificates to system keychain
  ansible.builtin.command:
    cmd: open "{{ item.item.file }}"
  loop: "{{ cert_check.results }}"
  when:
    - item.item.enabled | default(false)
    - item.rc != 0
  loop_control:
    label: "{{ item.item.name }}"
  tags: [network, certificates]

- name: Display certificate installation status
  ansible.builtin.debug:
    msg: "Certificate '{{ item.item.name }}' {{ 'installed' if item.rc != 0 else 'already present' }} in system keychain"
  loop: "{{ cert_check.results }}"
  when:
    - item.item.enabled | default(false)
  loop_control:
    label: "{{ item.item.name }}"
  tags: [network, certificates]
