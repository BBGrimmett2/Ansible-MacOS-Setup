---
# =============================================================================
# Network Tools Role - Install Bruno (Public Function)
# =============================================================================
# Installs Bruno API client (Postman/Insomnia alternative)
# =============================================================================

- name: Check if Bruno is installed
  ansible.builtin.stat:
    path: /Applications/Bruno.app
  register: network_tools_bruno_check

- name: Install Bruno via Homebrew
  ansible.builtin.command: brew install --cask bruno
  when:
    - network_tools_state == 'present'
    - network_tools_bruno_enabled | default(true)
    - not network_tools_bruno_check.stat.exists
  register: network_tools_bruno_install
  changed_when: network_tools_bruno_install.rc == 0
