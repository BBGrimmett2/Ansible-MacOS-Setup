---
# =============================================================================
# Network Tools Role - Install Wireshark (Public Function)
# =============================================================================
# Installs Wireshark network protocol analyzer
# =============================================================================

- name: Check if Wireshark is installed
  ansible.builtin.command: brew list --cask wireshark
  register: network_tools_wireshark_check
  changed_when: false
  failed_when: false

- name: Install Wireshark via Homebrew
  ansible.builtin.command: brew install --cask wireshark
  when:
    - network_tools_state == 'present'
    - network_tools_wireshark_check.rc != 0
  register: network_tools_wireshark_install
  changed_when: network_tools_wireshark_install.rc == 0
