---
# =============================================================================
# PAM Security Role - Configure YubiKey
# =============================================================================
# Public function: Enable YubiKey (U2F) hardware authentication.
# Can be called via: tasks_from: configure_yubikey
# =============================================================================

- name: Check if pam-u2f is installed
  ansible.builtin.command: which pam_u2f
  register: pam_u2f_check
  failed_when: false
  changed_when: false
  when: pam_yubikey_enabled

- name: Install pam-u2f module
  community.general.homebrew:
    name: pam-u2f
    state: present
  when:
    - pam_yubikey_enabled
    - pam_yubikey_install_module
    - pam_u2f_check.rc != 0

- name: Check if YubiKey is already configured in PAM
  ansible.builtin.command: grep -q "pam_u2f.so" {{ pam_sudo_config }}
  register: yubikey_check
  failed_when: false
  changed_when: false

- name: Display YubiKey configuration status
  ansible.builtin.debug:
    msg: "YubiKey {{ 'already configured' if yubikey_check.rc == 0 else 'not configured' }}"

- name: Configure YubiKey for sudo
  when:
    - pam_yubikey_enabled
    - yubikey_check.rc != 0
  become: true
  block:
    - name: Create Yubico config directory
      ansible.builtin.file:
        path: "{{ pam_u2f_authfile | dirname }}"
        state: directory
        mode: '0700'
      become: false

    - name: Backup PAM sudo configuration
      ansible.builtin.copy:
        src: "{{ pam_sudo_config }}"
        dest: "{{ pam_backup_dir }}/sudo.{{ ansible_date_time.epoch }}.yubikey"
        remote_src: true
        mode: '0644'
      when: pam_backup_original

    - name: Add YubiKey to PAM sudo configuration
      ansible.builtin.lineinfile:
        path: "{{ pam_sudo_config }}"
        line: "auth       {{ pam_yubikey_mode }}     pam_u2f.so"
        insertafter: "^auth.*pam_tid.so"
        state: present
        validate: "/usr/bin/grep -q 'auth' %s"
      register: yubikey_config

    - name: Display YubiKey configuration instructions
      ansible.builtin.debug:
        msg: |
          YubiKey PAM module configured.

          IMPORTANT: You must register your YubiKey(s) before it will work!

          To register your YubiKey:
          1. Insert your YubiKey
          2. Run: mkdir -p {{ pam_u2f_authfile | dirname }}
          3. Run: pamu2fcfg > {{ pam_u2f_authfile }}
          4. Touch your YubiKey when it blinks
          5. For additional keys, run: pamu2fcfg -n >> {{ pam_u2f_authfile }}

          Test with: sudo -k && sudo ls
      when: yubikey_config.changed

- name: Remove YubiKey configuration
  when:
    - not pam_yubikey_enabled
    - yubikey_check.rc == 0
  become: true
  block:
    - name: Remove YubiKey from PAM sudo configuration
      ansible.builtin.lineinfile:
        path: "{{ pam_sudo_config }}"
        regexp: "^auth.*pam_u2f.so"
        state: absent

    - name: Display YubiKey removal result
      ansible.builtin.debug:
        msg: "YubiKey configuration removed from sudo"
