---
# =============================================================================
# Dashlane Secrets Role - Argument Specifications
# =============================================================================

argument_specs:
  # ---------------------------------------------------------------------------
  # Main Entry Point
  # ---------------------------------------------------------------------------
  main:
    short_description: Validate Dashlane CLI authentication
    description:
      - Validates that Dashlane CLI is installed and authenticated
      - Does not fetch secrets - use public functions for that
    author: Brian Grimmett

    options:
      dashlane_cli:
        type: str
        required: false
        default: dcli
        description: Dashlane CLI command

      dashlane_secrets_cli:
        type: str
        description: Prefixed form of dashlane_cli.

      dashlane_validate_auth:
        type: bool
        required: false
        default: true
        description: Whether to validate Dashlane authentication

      # ---------------------------------------------------------------------------
      # Fetch SSH Key
      # ---------------------------------------------------------------------------
      dashlane_secrets_validate_auth:
        type: bool
        description: Prefixed form of dashlane_validate_auth.

  fetch_ssh_key:
    short_description: Fetch SSH private key from Dashlane
    description:
      - Retrieves an SSH private key from Dashlane
      - Saves to specified path with secure permissions
      - Use for deploying SSH keys without hardcoding
    author: Brian Grimmett

    options:
      dashlane_secret_name:
        type: str
        required: false
        description: >-
          Name of the secret in Dashlane (e.g., 'ssh_key_personal_github')

      dashlane_secrets_secret_name:
        type: str
        description: Prefixed form of dashlane_secret_name.

      dashlane_secret_output_path:
        type: str
        required: false
        description: >-
          Where to save the SSH key (e.g., '{{ ansible_facts['env']['HOME']
          }}/.ssh/id_github')

      dashlane_secrets_secret_output_path:
        type: str
        description: Prefixed form of dashlane_secret_output_path.

      dashlane_secret_permissions:
        type: str
        required: false
        default: "0600"
        description: File permissions for the SSH key

      dashlane_secrets_secret_permissions:
        type: str
        description: Prefixed form of dashlane_secret_permissions.

      dashlane_cli:
        type: str
        required: false
        default: dcli

      dashlane_secrets_cli:
        type: str
        description: Prefixed form of dashlane_cli.

      dashlane_fail_on_missing:
        type: bool
        required: false
        default: true
        description: Fail if secret not found in Dashlane

      # ---------------------------------------------------------------------------
      # Fetch Credential
      # ---------------------------------------------------------------------------
      dashlane_secrets_fail_on_missing:
        type: bool
        description: Prefixed form of dashlane_fail_on_missing.

  fetch_credential:
    short_description: Fetch username/password credential from Dashlane
    description:
      - Retrieves a username/password credential from Dashlane
      - Returns credential in registered variable
      - Does not write to disk by default
    author: Brian Grimmett

    options:
      dashlane_secret_name:
        type: str
        required: false
        description: Name of the credential in Dashlane

      dashlane_secrets_secret_name:
        type: str
        description: Prefixed form of dashlane_secret_name.

      dashlane_cli:
        type: str
        required: false
        default: dcli

      dashlane_secrets_cli:
        type: str
        description: Prefixed form of dashlane_cli.

      dashlane_fail_on_missing:
        type: bool
        required: false
        default: true

      # ---------------------------------------------------------------------------
      # Fetch File
      # ---------------------------------------------------------------------------
      dashlane_secrets_fail_on_missing:
        type: bool
        description: Prefixed form of dashlane_fail_on_missing.

  fetch_file:
    short_description: Fetch arbitrary file content from Dashlane
    description:
      - Retrieves file content from Dashlane (certificates, configs, etc.)
      - Saves to specified path
      - Use for VPN profiles, root CAs, configuration files
    author: Brian Grimmett

    options:
      dashlane_secret_name:
        type: str
        required: false
        description: Name of the file/note in Dashlane

      dashlane_secrets_secret_name:
        type: str
        description: Prefixed form of dashlane_secret_name.

      dashlane_secret_output_path:
        type: str
        required: false
        description: Where to save the file

      dashlane_secrets_secret_output_path:
        type: str
        description: Prefixed form of dashlane_secret_output_path.

      dashlane_secret_permissions:
        type: str
        required: false
        default: "0600"
        description: File permissions

      dashlane_secrets_secret_permissions:
        type: str
        description: Prefixed form of dashlane_secret_permissions.

      dashlane_cli:
        type: str
        required: false
        default: dcli

      dashlane_secrets_cli:
        type: str
        description: Prefixed form of dashlane_cli.

      dashlane_fail_on_missing:
        type: bool
        required: false
        default: true

      dashlane_secrets_fail_on_missing:
        type: bool
        description: Prefixed form of dashlane_fail_on_missing.

  fetch_secret:
    short_description: Retrieve a secure note value from Dashlane
    description: Retrieve an individual secret without writing it to disk
    options:
      dashlane_secret_name:
        type: str
        required: false
        description: Name of the Dashlane secure note
      dashlane_secrets_secret_name:
        type: str
        description: Prefixed form of dashlane_secret_name.

      dashlane_cli:
        type: str
        required: false
        default: dcli
        description: Dashlane CLI executable
      dashlane_secrets_cli:
        type: str
        description: Prefixed form of dashlane_cli.

      dashlane_fail_on_missing:
        type: bool
        required: false
        default: true
        description: Whether missing notes stop execution

      dashlane_secrets_fail_on_missing:
        type: bool
        description: Prefixed form of dashlane_fail_on_missing.
