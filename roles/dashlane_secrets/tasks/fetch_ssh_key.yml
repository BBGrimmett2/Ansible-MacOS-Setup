---
# =============================================================================
# Dashlane Secrets Role - Fetch SSH Key
# =============================================================================
# Public function: Fetch an SSH private key from Dashlane and save securely.
# Can be called via: tasks_from: fetch_ssh_key
#
# Required variables:
#   - dashlane_secret_name: Name of the secret in Dashlane
#   - dashlane_secret_output_path: Where to save the SSH key
#
# Optional variables:
#   - dashlane_secret_permissions: File permissions (default: 0600)
# =============================================================================

- name: Validate required variables for SSH key fetch
  ansible.builtin.assert:
    that:
      - dashlane_secret_name is defined
      - dashlane_secret_name | length > 0
      - dashlane_secret_output_path is defined
      - dashlane_secret_output_path | length > 0
    fail_msg: "Required variables: dashlane_secret_name and dashlane_secret_output_path"
    quiet: true

- name: Validate Dashlane CLI
  ansible.builtin.import_tasks: validate.yml

- name: Log SSH key retrieval attempt
  ansible.builtin.debug:
    msg: "Fetching SSH key '{{ dashlane_secret_name }}' from Dashlane"
  when: dashlane_log_retrievals

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ dashlane_secret_output_path | dirname }}"
    state: directory
    mode: '0700'

- name: Fetch SSH key from Dashlane
  ansible.builtin.shell: |
    {{ dashlane_cli }} read "{{ dashlane_secret_name }}" --output raw
  register: dashlane_ssh_key
  failed_when:
    - dashlane_ssh_key.rc != 0
    - dashlane_fail_on_missing
  changed_when: false
  no_log: "{{ dashlane_no_log }}"
  timeout: "{{ dashlane_timeout }}"

- name: Check if SSH key was retrieved
  ansible.builtin.set_fact:
    dashlane_key_retrieved: "{{ dashlane_ssh_key.rc == 0 }}"

- name: Deploy SSH key to filesystem
  ansible.builtin.copy:
    content: "{{ dashlane_ssh_key.stdout }}"
    dest: "{{ dashlane_secret_output_path }}"
    mode: "{{ dashlane_secret_permissions | default(dashlane_default_permissions) }}"
    owner: "{{ ansible_facts['env']['USER'] }}"
  when: dashlane_key_retrieved
  no_log: "{{ dashlane_no_log }}"

- name: Display SSH key deployment status
  ansible.builtin.debug:
    msg: "SSH key deployed to {{ dashlane_secret_output_path }}"
  when:
    - dashlane_key_retrieved
    - dashlane_log_retrievals

- name: Warn if SSH key not found
  ansible.builtin.debug:
    msg: "SSH key '{{ dashlane_secret_name }}' not found in Dashlane"
  when:
    - not dashlane_key_retrieved
    - not dashlane_fail_on_missing
