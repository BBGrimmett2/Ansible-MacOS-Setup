---
# =============================================================================
# Dashlane Secrets Role - Fetch Secret
# =============================================================================
# Public function: Fetch a single secret value from Dashlane Secure Note.
# Can be called via: tasks_from: fetch_secret
#
# Required variables:
#   - dashlane_secret_name: Name of the secret in Dashlane
#
# Returns:
#   - dashlane_secret_value: The secret value as a string
#   - dashlane_secret_retrieved: Boolean indicating success
# =============================================================================

- name: Validate required variables for secret fetch
  ansible.builtin.assert:
    that:
      - dashlane_secret_name is defined
      - dashlane_secret_name | length > 0
    fail_msg: "Required variable: dashlane_secret_name"
    quiet: true

- name: Validate Dashlane CLI
  ansible.builtin.import_tasks: validate.yml

- name: Log secret retrieval attempt
  ansible.builtin.debug:
    msg: "Fetching secret '{{ dashlane_secret_name }}' from Dashlane"
  when: dashlane_log_retrievals

- name: Fetch secret value from Dashlane
  ansible.builtin.shell: |
    {{ dashlane_cli }} note "{{ dashlane_secret_name }}" --output text
  register: dashlane_secret_output
  failed_when:
    - dashlane_secret_output.rc != 0
    - dashlane_fail_on_missing
  changed_when: false
  no_log: "{{ dashlane_no_log }}"
  timeout: "{{ dashlane_timeout }}"

- name: Set secret value fact
  ansible.builtin.set_fact:
    dashlane_secret_value: "{{ dashlane_secret_output.stdout | trim }}"
    dashlane_secret_retrieved: "{{ dashlane_secret_output.rc == 0 }}"
  no_log: "{{ dashlane_no_log }}"

- name: Display secret retrieval status
  ansible.builtin.debug:
    msg: "Secret '{{ dashlane_secret_name }}' retrieved successfully"
  when:
    - dashlane_secret_retrieved
    - dashlane_log_retrievals

- name: Warn if secret not found
  ansible.builtin.debug:
    msg: "Secret '{{ dashlane_secret_name }}' not found in Dashlane"
  when:
    - not dashlane_secret_retrieved
    - not dashlane_fail_on_missing
