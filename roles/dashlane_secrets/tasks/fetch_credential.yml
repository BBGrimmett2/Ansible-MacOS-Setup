---
# =============================================================================
# Dashlane Secrets Role - Fetch Credential
# =============================================================================
# Public function: Fetch username/password credential from Dashlane.
# Can be called via: tasks_from: fetch_credential
#
# Required variables:
#   - dashlane_secret_name: Name of the credential in Dashlane
#
# Returns:
#   - dashlane_credential: Object with .username and .password
# =============================================================================

- name: Validate required variables for credential fetch
  ansible.builtin.assert:
    that:
      - dashlane_secret_name is defined
      - dashlane_secret_name | length > 0
    fail_msg: "Required variable: dashlane_secret_name"
    quiet: true

- name: Validate Dashlane CLI
  ansible.builtin.import_tasks: validate.yml

- name: Log credential retrieval attempt
  ansible.builtin.debug:
    msg: "Fetching credential '{{ dashlane_secret_name }}' from Dashlane"
  when: dashlane_log_retrievals

- name: Fetch username from Dashlane
  ansible.builtin.shell: |
    {{ dashlane_cli }} read "{{ dashlane_secret_name }}" --field username --output raw
  register: dashlane_username
  failed_when:
    - dashlane_username.rc != 0
    - dashlane_fail_on_missing
  changed_when: false
  no_log: "{{ dashlane_no_log }}"
  timeout: "{{ dashlane_timeout }}"

- name: Fetch password from Dashlane
  ansible.builtin.shell: |
    {{ dashlane_cli }} read "{{ dashlane_secret_name }}" --field password --output raw
  register: dashlane_password
  failed_when:
    - dashlane_password.rc != 0
    - dashlane_fail_on_missing
  changed_when: false
  no_log: "{{ dashlane_no_log }}"
  timeout: "{{ dashlane_timeout }}"

- name: Set credential fact
  ansible.builtin.set_fact:
    dashlane_credential:
      username: "{{ dashlane_username.stdout }}"
      password: "{{ dashlane_password.stdout }}"
      retrieved: "{{ dashlane_username.rc == 0 and dashlane_password.rc == 0 }}"
  no_log: "{{ dashlane_no_log }}"

- name: Display credential retrieval status
  ansible.builtin.debug:
    msg: "Credential '{{ dashlane_secret_name }}' retrieved (username: {{ dashlane_credential.username }})"
  when:
    - dashlane_credential.retrieved
    - dashlane_log_retrievals

- name: Warn if credential not found
  ansible.builtin.debug:
    msg: "Credential '{{ dashlane_secret_name }}' not found in Dashlane"
  when:
    - not dashlane_credential.retrieved
    - not dashlane_fail_on_missing
