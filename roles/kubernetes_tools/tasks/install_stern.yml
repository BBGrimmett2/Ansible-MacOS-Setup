---
# =============================================================================
# Kubernetes Tools Role - Install stern (Public Function)
# =============================================================================
# Installs stern - Multi-pod log tailing tool
# =============================================================================

- name: Check if stern is installed
  ansible.builtin.command: brew list --formula stern
  register: kubernetes_tools_stern_check
  changed_when: false
  failed_when: false

- name: Install stern via Homebrew
  ansible.builtin.command: brew install stern
  when:
    - kubernetes_tools_state == 'present'
    - kubernetes_tools_stern_check.rc != 0
  register: kubernetes_tools_stern_install
  changed_when: kubernetes_tools_stern_install.rc == 0
