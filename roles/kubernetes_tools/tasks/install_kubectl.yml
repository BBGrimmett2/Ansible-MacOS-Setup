---
# =============================================================================
# Kubernetes Tools Role - Install Kubernetes CLI (Public Function)
# =============================================================================
# Installs kubectl for Kubernetes cluster management
# =============================================================================

- name: Check if kubectl is installed
  ansible.builtin.command: brew list --formula kubectl
  register: kubernetes_tools_kubectl_check
  changed_when: false
  failed_when: false

- name: Install kubectl via Homebrew
  ansible.builtin.command: brew install kubectl
  when:
    - kubernetes_tools_state == 'present'
    - kubernetes_tools_kubectl_check.rc != 0
  register: kubernetes_tools_kubectl_install
  changed_when: kubernetes_tools_kubectl_install.rc == 0
