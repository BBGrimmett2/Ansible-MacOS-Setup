---
# =============================================================================
# Desktop Apps Role - Default Variables
# =============================================================================
# Install and configure desktop applications
# =============================================================================

# -----------------------------------------------------------------------------
# Installation State
# -----------------------------------------------------------------------------

# Whether to install (present) or remove (absent) desktop apps
desktop_apps_state: present

# Install all apps (if false, only install enabled apps)
desktop_apps_install_all: false

# -----------------------------------------------------------------------------
# Individual App Control
# -----------------------------------------------------------------------------

# Google Chrome - Web browser
desktop_apps_chrome_enabled: true

# VS Code - Code editor
desktop_apps_vscode_enabled: true

# Cursor - AI-powered code editor
desktop_apps_cursor_enabled: true

# Canon PIXMA TR8520 scanning utility (personal-only; Canon download)
desktop_apps_canon_ij_scan_enabled: false
desktop_apps_canon_ij_scan_download_url: https://asia.canon/en/support/0200531730/
desktop_apps_canon_ij_scan_dmg_filename: msul-mac-4_2_1-ea21_3.dmg

# Microsoft 365 Office suite (personal only)
desktop_apps_microsoft_365_enabled: false

# AppCleaner - app removal and related-file cleanup (personal only)
desktop_apps_appcleaner_enabled: false

# Stats - macOS menu bar system monitoring (both profiles)
desktop_apps_stats_enabled: true

# Raycast - macOS launcher and productivity commands (both profiles)
desktop_apps_raycast_enabled: true

# ChatGPT - Official OpenAI desktop application (both profiles)
desktop_apps_chatgpt_enabled: true

# Nextcloud - Self-hosted cloud sync
desktop_apps_nextcloud_enabled: true

# Rectangle - Window management
desktop_apps_rectangle_enabled: true

# DisplayLink Manager - Multi-monitor support
desktop_apps_displaylink_enabled: true

# Elgato Camera Hub - Webcam software
desktop_apps_elgato_camera_hub_enabled: true

# Elgato Control Center - Stream Deck/lighting control
desktop_apps_elgato_control_center_enabled: true

# Obsidian - Note-taking app
desktop_apps_obsidian_enabled: true

# Discord - Communication platform
desktop_apps_discord_enabled: true

# Hidden Bar - Menu bar icon organizer
desktop_apps_hidden_bar_enabled: true

# Webex - Video conferencing
desktop_apps_webex_enabled: false

# -----------------------------------------------------------------------------
# Package Mapping (Homebrew cask names)
# -----------------------------------------------------------------------------

desktop_apps_packages:
  chrome: google-chrome
  vscode: visual-studio-code
  cursor: cursor
  microsoft_365: microsoft-office
  appcleaner: appcleaner
  stats: stats
  raycast: raycast
  chatgpt: chatgpt
  nextcloud: nextcloud
  rectangle: rectangle
  displaylink: displaylink
  obsidian: obsidian
  discord: discord
  hidden_bar: hiddenbar
  webex: webex

# -----------------------------------------------------------------------------
# Default Applications Configuration
# -----------------------------------------------------------------------------

# Configure default applications
desktop_apps_configure_defaults: true

# Set Chrome as default browser
desktop_apps_chrome_default_browser: true

# Set VS Code as default editor
desktop_apps_vscode_default_editor: true

# File associations for VS Code
desktop_apps_vscode_file_associations:
  - yml
  - yaml
  - json
  - sh
  - py
  - md
  - txt

# -----------------------------------------------------------------------------
# Nextcloud Configuration
# -----------------------------------------------------------------------------

# Launch Nextcloud after a new installation so the account can be connected.
desktop_apps_nextcloud_open: false

# -----------------------------------------------------------------------------
# Rectangle Configuration
# -----------------------------------------------------------------------------

# Open Rectangle after installation (launches it in the menu bar)
desktop_apps_rectangle_open: false

# Apply Rectangle preferences via macOS defaults
desktop_apps_rectangle_configure: false

# Use Rectangle's recommended shortcuts (true) vs Spectacle's shortcuts (false)
desktop_apps_rectangle_alternate_shortcuts: true

# Behavior on repeated command:
# 0: halves to thirds (Spectacle), 1: cycle displays for left/right,
# 2: disabled, 3: cycle displays + halves to thirds, 4: repeat on next display
desktop_apps_rectangle_subsequent_execution_mode: 0

# Keyboard shortcut overrides (dict with keyCode and modifierFlags integers)
# Leave as {} to use Rectangle's built-in defaults
desktop_apps_rectangle_left_half: {}
desktop_apps_rectangle_right_half: {}
desktop_apps_rectangle_toggle_todo: {}
desktop_apps_rectangle_reflow_todo: {}
