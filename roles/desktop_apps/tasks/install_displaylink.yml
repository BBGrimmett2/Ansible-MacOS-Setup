---
# =============================================================================
# Desktop Apps Role - Install Displaylink (Public Function)
# =============================================================================
# Installs Displaylink
# =============================================================================

- name: Check if Displaylink is installed
  ansible.builtin.command: brew list --cask displaylink
  register: desktop_apps_displaylink_check
  changed_when: false
  failed_when: false

- name: Install Displaylink via Homebrew
  ansible.builtin.command: brew install --cask displaylink
  when:
    - desktop_apps_state == 'present'
    - desktop_apps_displaylink_check.rc != 0
  register: desktop_apps_displaylink_install
  changed_when: desktop_apps_displaylink_install.rc == 0
