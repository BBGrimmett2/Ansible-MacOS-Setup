---
# =============================================================================
# Desktop Apps Role - Install Google Drive (Public Function)
# =============================================================================
# Installs and configures Google Drive
# =============================================================================

- name: Check if Google Drive is installed
  ansible.builtin.stat:
    path: /Applications/Google Drive.app
  register: desktop_apps_google_drive_check

- name: Install Google Drive via Homebrew
  ansible.builtin.command: brew install --cask google-drive
  when:
    - desktop_apps_state == 'present'
    - desktop_apps_google_drive_enabled | default(true)
    - not desktop_apps_google_drive_check.stat.exists
  register: desktop_apps_google_drive_install
  changed_when: desktop_apps_google_drive_install.rc == 0

- name: Open Google Drive for configuration
  ansible.builtin.command: open -a "Google Drive"
  when:
    - desktop_apps_state == 'present'
    - desktop_apps_google_drive_configure | default(false)
    - not desktop_apps_google_drive_check.stat.exists
  changed_when: false
  failed_when: false

- name: Display Google Drive configuration instructions
  ansible.builtin.debug:
    msg:
      - "Google Drive is installed"
      - "Configuration steps:"
      - "  1. Sign in with your Google account"
      - "  2. Choose folders to sync"
      - "  3. Configure sync preferences"
      - "  4. Set up streaming or mirroring mode"
  when:
    - desktop_apps_state == 'present'
    - desktop_apps_google_drive_configure | default(false)
    - not desktop_apps_google_drive_check.stat.exists
