---
# Canon PIXMA TR8520: IJ Scan Utility Lite 4.2.1.
# Canon gates its DMG download behind a user-accepted disclaimer.
# Open Canon's first-party download page if the DMG has not been obtained.
# Once downloaded, open the DMG to let the user complete Canon's .pkg wizard.
# Never assume a download page response is a DMG or bypass license acceptance.

- name: Check whether Canon IJ Scan Utility Lite is installed
  ansible.builtin.stat:
    path: /Applications/Canon Utilities/IJ Scan Utility/IJ Scan Utility Lite.app
  register: desktop_apps_canon_scan_check

- name: Prepare Canon scan installer when utility is missing
  when:
    - desktop_apps_state == 'present'
    - not desktop_apps_canon_scan_check.stat.exists
  block:
    - name: Check whether official Canon DMG is already downloaded
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/Downloads/{{ desktop_apps_canon_ij_scan_dmg_filename }}"
      register: desktop_apps_canon_scan_dmg

    - name: Open Canon IJ Scan Utility Lite disk image
      ansible.builtin.command:
        argv:
          - open
          - "{{ ansible_facts['env']['HOME'] }}/Downloads/{{ desktop_apps_canon_ij_scan_dmg_filename }}"
      when:
        - desktop_apps_canon_scan_dmg.stat.exists
        - not ansible_check_mode
      changed_when: false

    - name: Open official Canon download page when disk image is missing
      ansible.builtin.command:
        argv:
          - open
          - "{{ desktop_apps_canon_ij_scan_download_url }}"
      when:
        - not desktop_apps_canon_scan_dmg.stat.exists
        - not ansible_check_mode
      changed_when: false

    - name: Explain Canon installer completion steps
      ansible.builtin.debug:
        msg: >-
          {{ 'Canon DMG opened. Run the .pkg inside it to finish installing IJ Scan Utility Lite.'
             if desktop_apps_canon_scan_dmg.stat.exists
             else 'Canon download page opened. Accept Canon’s disclaimer and download '
                  ~ desktop_apps_canon_ij_scan_dmg_filename
                  ~ ' to Downloads; rerun setup to open the disk image.' }}
