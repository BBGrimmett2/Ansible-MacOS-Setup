---
# Canon IJ Scan Utility Lite for PIXMA TR8520.
# Unlike Elgato's apps, Canon does not have a verified Homebrew cask.
# Follow the same installer approach: check whether the app is present and
# launch Canon's installer workflow only when it is absent.

- name: Check if Canon IJ Scan Utility Lite is installed
  ansible.builtin.stat:
    path: /Applications/Canon Utilities/IJ Scan Utility/IJ Scan Utility Lite.app
  register: desktop_apps_canon_ij_scan_check

- name: Check for downloaded Canon IJ Scan Utility Lite DMG
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/Downloads/{{ desktop_apps_canon_ij_scan_dmg_filename }}"
  register: desktop_apps_canon_ij_scan_dmg
  when:
    - desktop_apps_state == 'present'
    - not desktop_apps_canon_ij_scan_check.stat.exists

- name: Open downloaded Canon IJ Scan Utility Lite DMG
  ansible.builtin.command:
    argv:
      - open
      - "{{ ansible_facts['env']['HOME'] }}/Downloads/{{ desktop_apps_canon_ij_scan_dmg_filename }}"
  when:
    - desktop_apps_state == 'present'
    - not desktop_apps_canon_ij_scan_check.stat.exists
    - desktop_apps_canon_ij_scan_dmg.stat.exists
    - not ansible_check_mode
  changed_when: false

- name: Open official Canon IJ Scan Utility Lite download page
  ansible.builtin.command:
    argv:
      - open
      - "{{ desktop_apps_canon_ij_scan_download_url }}"
  when:
    - desktop_apps_state == 'present'
    - not desktop_apps_canon_ij_scan_check.stat.exists
    - not desktop_apps_canon_ij_scan_dmg.stat.exists
    - not ansible_check_mode
  changed_when: false

- name: Display Canon IJ Scan Utility Lite installation instructions
  ansible.builtin.debug:
    msg:
      - "Canon IJ Scan Utility Lite is not installed."
      - "{{ 'Open the .pkg inside the DMG to complete installation.' if desktop_apps_canon_ij_scan_dmg.stat.exists else 'Accept Canon\'s download disclaimer and save the DMG to Downloads, then rerun setup.' }}"
      - "Official Canon installer: {{ desktop_apps_canon_ij_scan_download_url }}"
  when:
    - desktop_apps_state == 'present'
    - not desktop_apps_canon_ij_scan_check.stat.exists
