---
# =============================================================================
# Desktop Apps Role - Install Discord (Public Function)
# =============================================================================
# Installs Discord
# =============================================================================

- name: Check if Discord is installed
  ansible.builtin.command: brew list --cask discord
  register: desktop_apps_discord_check
  changed_when: false
  failed_when: false

- name: Install Discord via Homebrew
  ansible.builtin.command: brew install --cask discord
  when:
    - desktop_apps_state == 'present'
    - desktop_apps_discord_check.rc != 0
  register: desktop_apps_discord_install
  changed_when: desktop_apps_discord_install.rc == 0
