---
# =============================================================================
# Desktop Apps Role - Install Obsidian (Public Function)
# =============================================================================
# Installs Obsidian
# =============================================================================

- name: Check if Obsidian is installed
  ansible.builtin.stat:
    path: /Applications/Obsidian.app
  register: desktop_apps_obsidian_check

- name: Install Obsidian via Homebrew
  ansible.builtin.command: brew install --cask obsidian
  when:
    - desktop_apps_state == 'present'
    - desktop_apps_obsidian_enabled | default(true)
    - not desktop_apps_obsidian_check.stat.exists
  register: desktop_apps_obsidian_install
  changed_when: desktop_apps_obsidian_install.rc == 0
