---
# =============================================================================
# Desktop Apps Role - Install Rectangle (Public Function)
# =============================================================================
# Installs Rectangle
# =============================================================================

- name: Check if Rectangle is installed
  ansible.builtin.stat:
    path: /Applications/Rectangle.app
  register: desktop_apps_rectangle_check

- name: Install Rectangle via Homebrew
  ansible.builtin.command: brew install --cask rectangle
  when:
    - desktop_apps_state == 'present'
    - desktop_apps_rectangle_enabled | default(true)
    - not desktop_apps_rectangle_check.stat.exists
  register: desktop_apps_rectangle_install
  changed_when: desktop_apps_rectangle_install.rc == 0
