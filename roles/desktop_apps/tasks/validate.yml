---
# =============================================================================
# Desktop Apps Role - Validation Tasks
# =============================================================================
# Validates prerequisites before installing desktop apps
# =============================================================================

- name: Validate Homebrew is installed
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/brew"
  register: desktop_apps_brew_binary
  failed_when: not desktop_apps_brew_binary.stat.exists
  vars:
    homebrew_prefix: >-
      {{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else
      '/usr/local' }}

- name: Validate macOS platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "This role is designed for macOS only"
    quiet: true

- name: Validate personal Ollama configuration
  ansible.builtin.assert:
    that:
      - desktop_apps_ollama_enabled is boolean
      - desktop_apps_ollama_open is boolean
      - desktop_apps_ollama_models is sequence
      - desktop_apps_ollama_models is not string
      - desktop_apps_ollama_models | length <= 20
      - (desktop_apps_ollama_models | reject('match', '^[A-Za-z0-9][A-Za-z0-9._/-]*:[A-Za-z0-9._-]+$') | list | length) == 0
      - desktop_apps_packages is mapping
      - desktop_apps_packages.ollama is string
      - desktop_apps_packages.ollama == 'ollama-app'
      - not (desktop_apps_ollama_enabled | bool) or workstation_profile == 'personal'
    fail_msg: Ollama must use the official ollama-app cask on the personal profile only
    quiet: true
