---
# =============================================================================
# CLI Tools Role - Default Variables
# =============================================================================
# Install and configure essential CLI quality-of-life tools.
# =============================================================================

# -----------------------------------------------------------------------------
# Installation State
# -----------------------------------------------------------------------------

# Whether to install (present) or remove (absent) CLI tools
cli_tools_state: present

# Package lists are defined by inventory, never embedded in role defaults.
# The empty fallback allows the role to be reused with a custom inventory.
cli_tools_packages_common: []
cli_tools_packages_extra: []

# The direnv configuration tasks only run when direnv is selected.
cli_tools_direnv_enabled: "{{ 'direnv' in ((cli_tools_packages_common | default([])) + (cli_tools_packages_extra | default([]))) }}"

# -----------------------------------------------------------------------------
# direnv Configuration (Special - Safety Checks)
# -----------------------------------------------------------------------------

# Configure direnv with safety checks for Projects/ directory
cli_tools_direnv_configure: true

# Enable safety prompts when in Projects/ directory
cli_tools_direnv_safety_enabled: true

# Projects directory path for safety checks
cli_tools_direnv_projects_path: "{{ ansible_facts['env']['HOME'] }}/Documents/Projects"

# direnv configuration directory
cli_tools_direnv_config_dir: "{{ ansible_facts['env']['HOME'] }}/.config/direnv"

# direnv configuration file
cli_tools_direnv_config_file: "{{ cli_tools_direnv_config_dir }}/direnvrc"

# -----------------------------------------------------------------------------
# Tool-Specific Configuration
# -----------------------------------------------------------------------------

# bat theme (for syntax highlighting)
cli_tools_bat_theme: "TwoDark"

# fd - respect .gitignore by default
cli_tools_fd_respect_gitignore: true

# fzf - default options
cli_tools_fzf_default_opts: "--height 40% --layout=reverse --border"

# git-delta - side-by-side diffs
cli_tools_git_delta_side_by_side: true
