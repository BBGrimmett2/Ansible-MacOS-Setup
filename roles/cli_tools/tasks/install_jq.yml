---
# =============================================================================
# CLI Tools Role - Install jq (Public Function)
# =============================================================================
# Installs jq JSON processor
# =============================================================================

- name: Check if jq is installed
  ansible.builtin.command: brew list --formula jq
  register: cli_tools_jq_check
  changed_when: false
  failed_when: false

- name: Install jq via Homebrew
  ansible.builtin.command: brew install jq
  when:
    - cli_tools_state == 'present'
    - cli_tools_jq_check.rc != 0
  register: cli_tools_jq_install
  changed_when: cli_tools_jq_install.rc == 0
