---
- name: Install pipx via Homebrew
  community.general.homebrew:
    name: "{{ cli_tools_packages.pipx }}"
    state: "{{ cli_tools_state }}"

- name: Ensure pipx executable directory is on PATH
  ansible.builtin.command: pipx ensurepath
  register: pipx_ensurepath
  changed_when: "'Success!' in pipx_ensurepath.stdout"
  when: cli_tools_state == 'present'
