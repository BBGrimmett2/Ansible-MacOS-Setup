---
# =============================================================================
# CLI Tools Role - Validation Tasks
# =============================================================================
# Validates prerequisites before installing CLI tools
# =============================================================================

- name: Validate Homebrew is installed
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/brew"
  register: cli_tools_brew_binary
  failed_when: not cli_tools_brew_binary.stat.exists
  vars:
    homebrew_prefix: >-
      {{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else
      '/usr/local' }}

- name: Validate macOS platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Darwin'
    fail_msg: "This role is designed for macOS only"
    quiet: true

- name: Validate direnv configuration directory path
  ansible.builtin.assert:
    that:
      - cli_tools_direnv_config_dir is defined
      - cli_tools_direnv_config_dir | length > 0
    fail_msg: "cli_tools_direnv_config_dir must be defined"
    quiet: true
  when: cli_tools_direnv_enabled

- name: Validate Projects directory path for direnv safety
  ansible.builtin.assert:
    that:
      - cli_tools_direnv_projects_path is defined
      - cli_tools_direnv_projects_path | length > 0
    fail_msg: >-
      cli_tools_direnv_projects_path must be defined when safety is enabled
    quiet: true
  when:
    - cli_tools_direnv_enabled
    - cli_tools_direnv_safety_enabled

- name: Validate shared and profile-specific CLI package lists
  ansible.builtin.assert:
    that:
      - cli_tools_packages_common is sequence
      - cli_tools_packages_common is not string
      - cli_tools_packages_extra is sequence
      - cli_tools_packages_extra is not string
    fail_msg: >-
      CLI packages must be lists in all.yml and profiles/{personal,work}.yml

- name: Validate names in enabled CLI package lists
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[A-Za-z0-9@+_.-]+$')
    fail_msg: "Invalid Homebrew formula name '{{ item }}' in CLI package list"
    quiet: true
  loop: "{{ cli_tools_packages_common + cli_tools_packages_extra }}"
  loop_control:
    label: "{{ item }}"
