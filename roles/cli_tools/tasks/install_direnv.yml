---
# =============================================================================
# CLI Tools Role - Install direnv (Public Function)
# =============================================================================
# Installs direnv for per-directory environment variables
# =============================================================================

- name: Check if direnv is installed
  ansible.builtin.command: brew list --formula direnv
  register: cli_tools_direnv_check
  changed_when: false
  failed_when: false

- name: Install direnv via Homebrew
  ansible.builtin.command: brew install direnv
  when:
    - cli_tools_state == 'present'
    - cli_tools_direnv_check.rc != 0
  register: cli_tools_direnv_install
  changed_when: cli_tools_direnv_install.rc == 0
