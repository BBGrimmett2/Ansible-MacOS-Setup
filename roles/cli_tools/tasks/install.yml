---
# Install selected CLI formulae in one Homebrew invocation instead of
# repeated 'brew list' + 'brew install' calls for each tool.
# Homebrew may fail on a mixed batch when some formulae are already installed.
# Query installed formulae once and submit only missing packages.

- name: Build list of enabled CLI Homebrew formulae
  ansible.builtin.set_fact:
    cli_tools_selected_formulae: >-
      {{
        [
          cli_tools_packages.jq if (cli_tools_install_all or cli_tools_jq_enabled) else '',
          cli_tools_packages.yq if (cli_tools_install_all or cli_tools_yq_enabled) else '',
          cli_tools_packages.direnv if (cli_tools_install_all or cli_tools_direnv_enabled) else '',
          cli_tools_packages.eza if (cli_tools_install_all or cli_tools_eza_enabled) else '',
          cli_tools_packages.bat if (cli_tools_install_all or cli_tools_bat_enabled) else '',
          cli_tools_packages.fd if (cli_tools_install_all or cli_tools_fd_enabled) else '',
          cli_tools_packages.fzf if (cli_tools_install_all or cli_tools_fzf_enabled) else '',
          cli_tools_packages.git_delta if (cli_tools_install_all or cli_tools_git_delta_enabled) else '',
          cli_tools_packages.pipx if (cli_tools_install_all or cli_tools_pipx_enabled) else ''
        ] | reject('equalto', '') | list
      }}

- name: Get installed Homebrew formulae once
  ansible.builtin.command: brew list --formula
  register: cli_tools_installed_formulae
  changed_when: false

- name: Select only formulae not yet installed
  ansible.builtin.set_fact:
    cli_tools_missing_formulae: >-
      {{ cli_tools_selected_formulae | difference(cli_tools_installed_formulae.stdout_lines) }}

- name: Install missing CLI formulae in one batch
  community.general.homebrew:
    name: "{{ cli_tools_missing_formulae }}"
    state: present
    update_homebrew: false
  when: cli_tools_missing_formulae | length > 0

- name: Add pipx user scripts to PATH
  ansible.builtin.command: pipx ensurepath
  register: pipx_ensurepath
  changed_when: "'Success!' in pipx_ensurepath.stdout"
  when: cli_tools_packages.pipx in cli_tools_selected_formulae
