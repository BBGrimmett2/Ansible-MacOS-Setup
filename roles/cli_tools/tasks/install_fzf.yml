---
# =============================================================================
# CLI Tools Role - Install fzf (Public Function)
# =============================================================================
# Installs fzf - command-line fuzzy finder
# =============================================================================

- name: Check if fzf is installed
  ansible.builtin.command: brew list --formula fzf
  register: cli_tools_fzf_check
  changed_when: false
  failed_when: false

- name: Install fzf via Homebrew
  ansible.builtin.command: brew install fzf
  when:
    - cli_tools_state == 'present'
    - cli_tools_fzf_check.rc != 0
  register: cli_tools_fzf_install
  changed_when: cli_tools_fzf_install.rc == 0
