---
# =============================================================================
# CLI Tools Role - Install git-delta (Public Function)
# =============================================================================
# Installs git-delta - git diff pager with syntax highlighting
# =============================================================================

- name: Check if git-delta is installed
  ansible.builtin.command: brew list --formula git-delta
  register: cli_tools_git_delta_check
  changed_when: false
  failed_when: false

- name: Install git-delta via Homebrew
  ansible.builtin.command: brew install git-delta
  when:
    - cli_tools_state == 'present'
    - cli_tools_git_delta_check.rc != 0
  register: cli_tools_git_delta_install
  changed_when: cli_tools_git_delta_install.rc == 0
