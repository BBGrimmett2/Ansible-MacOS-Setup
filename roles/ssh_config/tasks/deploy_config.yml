---
# =============================================================================
# SSH Config Role - Deploy SSH Config File
# =============================================================================
# Deploy SSH client configuration from template or Dashlane.
# Configuration: inventories/host_vars/localhost.yml (ssh_config_host_configs)
# =============================================================================

# The template module creates a backup only when content actually changes.
# No separate timestamped copy is made on every run.

- name: Deploy SSH config from Dashlane
  when: ssh_config_from_dashlane
  block:
    - name: Fetch SSH config from Dashlane
      ansible.builtin.include_role:
        name: dashlane_secrets
        tasks_from: fetch_file
      vars:
        dashlane_secrets_secret_name: "{{ ssh_config_dashlane_secret }}"
        dashlane_secrets_secret_output_path: "{{ ssh_config_file }}"
        dashlane_secrets_secret_permissions: "{{ ssh_config_permissions }}"

    - name: Display SSH config deployment status
      ansible.builtin.debug:
        msg: "SSH config deployed from Dashlane ({{ ssh_config_dashlane_secret }})"

- name: Deploy SSH config from template
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ ssh_config_file }}"
    mode: "{{ ssh_config_permissions }}"
    backup: "{{ ssh_config_backup_existing }}"
  when: not ssh_config_from_dashlane

- name: Display SSH config deployment status (template)
  ansible.builtin.debug:
    msg: "SSH config deployed from template ({{ ssh_config_host_configs | selectattr('enabled', 'equalto', true) | list | length }} host configs enabled)"
  when: not ssh_config_from_dashlane
