---
# =============================================================================
# SSH Config Role - Deploy SSH Config File
# =============================================================================
# Public function: Deploy SSH client configuration.
# Can be called via: tasks_from: deploy_config
# =============================================================================

- name: Check if SSH config exists
  ansible.builtin.stat:
    path: "{{ ssh_config_file }}"
  register: ssh_config_stat

- name: Backup existing SSH config
  ansible.builtin.copy:
    src: "{{ ssh_config_file }}"
    dest: "{{ ssh_config_file }}.backup.{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: "{{ ssh_config_permissions }}"
  when:
    - ssh_backup_existing
    - ssh_config_stat.stat.exists

- name: Deploy SSH config from Dashlane
  when: ssh_config_from_dashlane
  block:
    - name: Set Dashlane secret name for SSH config
      ansible.builtin.set_fact:
        ssh_config_secret_name: "{{ ssh_config_dashlane_secret_personal if workstation_profile == 'personal' else ssh_config_dashlane_secret_work }}"

    - name: Fetch SSH config from Dashlane
      ansible.builtin.include_role:
        name: dashlane_secrets
        tasks_from: fetch_file
      vars:
        dashlane_secret_name: "{{ ssh_config_secret_name }}"
        dashlane_secret_output_path: "{{ ssh_config_file }}"
        dashlane_secret_permissions: "{{ ssh_config_permissions }}"

    - name: Display SSH config deployment status
      ansible.builtin.debug:
        msg: "SSH config deployed from Dashlane ({{ ssh_config_secret_name }}) for {{ workstation_profile }} profile"

- name: Deploy SSH config from template
  ansible.builtin.template:
    src: "ssh_config_{{ workstation_profile }}.j2"
    dest: "{{ ssh_config_file }}"
    mode: "{{ ssh_config_permissions }}"
    backup: "{{ ssh_backup_existing }}"
  when: not ssh_config_from_dashlane

- name: Display SSH config deployment status (template)
  ansible.builtin.debug:
    msg: "SSH config deployed from template for {{ workstation_profile }} profile"
  when: not ssh_config_from_dashlane
