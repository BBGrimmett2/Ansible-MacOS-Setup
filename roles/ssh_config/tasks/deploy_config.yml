---
# =============================================================================
# SSH Config Role - Deploy SSH Config File
# =============================================================================
# Deploy SSH client configuration from template or Dashlane.
# Configuration: host_vars/localhost.yml (ssh_host_configs)
# =============================================================================

- name: Check if SSH config exists
  ansible.builtin.stat:
    path: "{{ ssh_config_file }}"
  register: ssh_config_stat

- name: Backup existing SSH config
  ansible.builtin.copy:
    src: "{{ ssh_config_file }}"
    dest: "{{ ssh_config_file }}.backup.{{ ansible_date_time.epoch }}"
    remote_src: true
    mode: "{{ ssh_config_permissions }}"
  when:
    - ssh_backup_existing
    - ssh_config_stat.stat.exists

- name: Deploy SSH config from Dashlane
  when: ssh_config_from_dashlane
  block:
    - name: Fetch SSH config from Dashlane
      ansible.builtin.include_role:
        name: dashlane_secrets
        tasks_from: fetch_file
      vars:
        dashlane_secret_name: "{{ ssh_config_dashlane_secret }}"
        dashlane_secret_output_path: "{{ ssh_config_file }}"
        dashlane_secret_permissions: "{{ ssh_config_permissions }}"

    - name: Display SSH config deployment status
      ansible.builtin.debug:
        msg: "SSH config deployed from Dashlane ({{ ssh_config_dashlane_secret }})"

- name: Deploy SSH config from template
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ ssh_config_file }}"
    mode: "{{ ssh_config_permissions }}"
    backup: "{{ ssh_backup_existing }}"
  when: not ssh_config_from_dashlane

- name: Display SSH config deployment status (template)
  ansible.builtin.debug:
    msg: "SSH config deployed from template ({{ ssh_host_configs | selectattr('enabled', 'equalto', true) | list | length }} host configs enabled)"
  when: not ssh_config_from_dashlane
