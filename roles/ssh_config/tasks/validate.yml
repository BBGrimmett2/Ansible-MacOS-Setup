---
# =============================================================================
# SSH Config Role - Validation Tasks
# =============================================================================

- name: Ensure workstation_profile is defined
  ansible.builtin.assert:
    that:
      - workstation_profile is defined
      - workstation_profile in ['personal', 'work']
    fail_msg: "workstation_profile must be set to 'personal' or 'work'"
    success_msg: "Profile validation passed: {{ workstation_profile }}"
    quiet: true

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}"
    state: directory
    mode: "{{ ssh_dir_permissions }}"

- name: Display SSH configuration info
  ansible.builtin.debug:
    msg: |
      SSH Configuration:
      - Profile: {{ workstation_profile }}
      - SSH Directory: {{ ssh_config_dir }}
      - Keys to deploy: {{ (ssh_personal_keys if workstation_profile == 'personal' else ssh_work_keys) | length }}
