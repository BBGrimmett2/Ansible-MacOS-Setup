---
# =============================================================================
# SSH Config Role - Validation Tasks
# =============================================================================

- name: Ensure SSH directory exists
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}"
    state: directory
    mode: "{{ ssh_dir_permissions }}"

- name: Display SSH configuration info
  ansible.builtin.debug:
    msg: |
      SSH Configuration:
      - SSH Directory: {{ ssh_config_dir }}
      - Keys configured: {{ ssh_keys | length }}
      - Keys enabled: {{ ssh_keys | selectattr('enabled', 'equalto', true) | list | length }}
      - Host configs: {{ ssh_host_configs | length }}
