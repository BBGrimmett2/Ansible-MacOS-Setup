---
# =============================================================================
# SSH Config Role - Main Tasks
# =============================================================================
# Orchestrates SSH configuration and key deployment.
# Configuration: Defined in inventories/host_vars/localhost.yml (ssh_keys list)
# =============================================================================

- name: Validate SSH configuration
  ansible.builtin.import_tasks: validate.yml
  tags:
    - ssh_config
    - ssh_config:validate

- name: Deploy SSH keys
  ansible.builtin.import_tasks: deploy_keys.yml
  tags:
    - ssh_config
    - ssh_config:keys

- name: Deploy SSH config file
  ansible.builtin.import_tasks: deploy_config.yml
  when: ssh_deploy_config
  tags:
    - ssh_config
    - ssh_config:config

- name: Manage SSH known_hosts
  ansible.builtin.import_tasks: manage_known_hosts.yml
  when: ssh_manage_known_hosts
  tags:
    - ssh_config
    - ssh_config:known_hosts

- name: Display SSH configuration summary
  ansible.builtin.debug:
    msg: |
      SSH Configuration Summary:
      - Keys enabled: {{ ssh_keys | selectattr('enabled', 'equalto', true) | list | length }}
      - Config file: {{ 'deployed' if ssh_deploy_config else 'skipped' }}
      - Known hosts: {{ 'managed' if ssh_manage_known_hosts else 'skipped' }}
  tags:
    - ssh_config
    - ssh_config:summary
