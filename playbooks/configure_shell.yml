---
# =============================================================================
# Configure Shell Environment Playbook
# =============================================================================
# Purpose: Deploy ZSH configuration with tool integrations
# Usage: ansible-playbook playbooks/configure_shell.yml
# =============================================================================

- name: Configure Shell Environment
  hosts: localhost
  gather_facts: true

  vars_prompt:
    - name: workstation_profile
      prompt: "Select workstation profile (personal/work)"
      private: false

  pre_tasks:
    - name: Load and validate selected profile
      ansible.builtin.import_tasks: tasks/load_profile.yml
      tags: [always]

  roles:
    - role: shell_environment
      tags: [shell_environment]
