---
# =============================================================================
# Install Terminal Emulator Playbook
# =============================================================================
# Purpose: Install and configure terminal emulator with Nerd Fonts
# Usage: ansible-playbook playbooks/install_terminal.yml
# =============================================================================

- name: Install Terminal Emulator
  hosts: localhost
  gather_facts: true

  vars_prompt:
    - name: workstation_profile
      prompt: "Select workstation profile (personal/work)"
      private: false

  pre_tasks:
    - name: Load and validate selected profile
      ansible.builtin.import_tasks: tasks/load_profile.yml
      tags: [always]

  roles:
    - role: terminal
      tags: [terminal]
