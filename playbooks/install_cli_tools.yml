---
# =============================================================================
# Install CLI Tools Playbook
# =============================================================================
# Purpose: Install and configure CLI quality-of-life tools
# Usage: ansible-playbook playbooks/install_cli_tools.yml
# =============================================================================

- name: Install CLI Tools
  hosts: localhost
  gather_facts: true

  vars_prompt:
    - name: workstation_profile
      prompt: "Select workstation profile (personal/work)"
      private: false

  pre_tasks:
    - name: Load and validate selected profile
      ansible.builtin.import_tasks: tasks/load_profile.yml
      tags: [always]

  roles:
    - role: cli_tools
      tags: [cli_tools]
