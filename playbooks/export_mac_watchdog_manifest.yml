---
- name: Export personal expected state for the macOS watchdog
  hosts: localhost
  gather_facts: true
  vars:
    workstation_profile: personal
  pre_tasks:
    - name: Load shared package definitions
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventories/group_vars/all.yml"
        name: watchdog_shared_config

    - name: Load non-secret personal profile
      ansible.builtin.include_vars:
        file: >-
          {{ playbook_dir }}/../inventories/group_vars/profiles/personal.yml
        name: watchdog_personal_config
  tasks:
    - name: Export expected-state manifest
      ansible.builtin.import_role:
        name: mac_watchdog_manifest
      vars:
        mac_watchdog_manifest_repo_root: "{{ playbook_dir }}/.."
        mac_watchdog_manifest_formulae_common: >-
          {{ watchdog_shared_config.cli_tools_packages_common }}
        mac_watchdog_manifest_formulae_extra: >-
          {{ watchdog_personal_config.cli_tools_packages_extra }}
        mac_watchdog_manifest_resources: >-
          {{ watchdog_personal_config.mac_watchdog_expected_resources }}
