---
# =============================================================================
# Install Desktop Applications Playbook
# =============================================================================
# Purpose: Install desktop applications
# Usage: ansible-playbook playbooks/install_desktop_apps.yml
# =============================================================================

- name: Install Desktop Applications
  hosts: localhost
  gather_facts: true

  vars_prompt:
    - name: workstation_profile
      prompt: "Select workstation profile (personal/work)"
      private: false

  pre_tasks:
    - name: Load and validate selected profile
      ansible.builtin.import_tasks: tasks/load_profile.yml
      tags: [always]

  roles:
    - role: desktop_apps
      tags: [desktop_apps]
