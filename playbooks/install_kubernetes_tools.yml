---
# =============================================================================
# Install Kubernetes Tools Playbook
# =============================================================================
# Purpose: Install Kubernetes and OpenShift tooling
# Usage: ansible-playbook playbooks/install_kubernetes_tools.yml
# =============================================================================

- name: Install Kubernetes Tools
  hosts: localhost
  gather_facts: true

  vars_prompt:
    - name: workstation_profile
      prompt: "Select workstation profile (personal/work)"
      private: false

  pre_tasks:
    - name: Load and validate selected profile
      ansible.builtin.import_tasks: tasks/load_profile.yml
      tags: [always]

  roles:
    - role: kubernetes_tools
      tags: [kubernetes_tools]
