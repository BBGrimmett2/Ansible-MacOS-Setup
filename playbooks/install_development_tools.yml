---
# =============================================================================
# Install Development Tools Playbook
# =============================================================================
# Purpose: Install development and automation tools
# Usage: ansible-playbook playbooks/install_development_tools.yml
# =============================================================================

- name: Install Development Tools
  hosts: localhost
  gather_facts: true

  vars_prompt:
    - name: workstation_profile
      prompt: "Select workstation profile (personal/work)"
      private: false

  pre_tasks:
    - name: Load and validate selected profile
      ansible.builtin.import_tasks: tasks/load_profile.yml
      tags: [always]

  roles:
    - role: development_tools
      tags: [development_tools]
