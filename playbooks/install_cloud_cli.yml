---
# =============================================================================
# Install Cloud CLI Tools Playbook
# =============================================================================
# Purpose: Install cloud provider CLI tools
# Usage: ansible-playbook playbooks/install_cloud_cli.yml
# =============================================================================

- name: Install Cloud CLI Tools
  hosts: localhost
  gather_facts: true

  vars_prompt:
    - name: workstation_profile
      prompt: "Select workstation profile (personal/work)"
      private: false

  pre_tasks:
    - name: Load and validate selected profile
      ansible.builtin.import_tasks: tasks/load_profile.yml
      tags: [always]

  roles:
    - role: cloud_cli
      tags: [cloud_cli]
