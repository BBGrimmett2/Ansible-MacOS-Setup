---
# =============================================================================
# Bootstrap Workstation - Main Playbook
# =============================================================================
# Purpose: Complete macOS workstation setup with profile-based configuration
# Usage: ansible-playbook playbooks/bootstrap_workstation.yml
#
# This is the main entry point for setting up a macOS workstation from scratch.
# It supports both personal and work (Red Hat) profiles with different tools
# and configurations for each.
# =============================================================================

- name: Bootstrap macOS Workstation
  hosts: localhost
  gather_facts: true

  vars_prompt:
    - name: workstation_profile
      prompt: "Select workstation profile (personal/work)"
      private: false
      default: "work"

  pre_tasks:
    - name: Validate profile selection
      ansible.builtin.assert:
        that:
          - workstation_profile in ['personal', 'work']
        fail_msg: "Profile must be 'personal' or 'work', got '{{ workstation_profile }}'"
        success_msg: "Profile '{{ workstation_profile }}' selected"

    - name: Display profile information
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Workstation Profile: {{ workstation_profile }}"
          - "=========================================="
          - "{% if workstation_profile == 'work' %}Work profile includes Red Hat-specific tools and configurations{% else %}Personal profile with standard development tools{% endif %}"

  roles:
    # Foundation - Required for all profiles
    - role: homebrew
      tags: [foundation, homebrew]

    - role: dashlane_secrets
      tags: [foundation, secrets]

    # System Configuration
    - role: macos_defaults
      tags: [system, macos_defaults]

    # - role: pam_security
    #   tags: [system, security, pam]

    - role: ssh_config
      tags: [system, ssh]

    # CLI Tools
    - role: cli_tools
      tags: [tools, cli]

    - role: terminal
      tags: [tools, terminal]

    - role: cloud_cli
      tags: [tools, cloud]

    - role: kubernetes_tools
      tags: [tools, kubernetes]

    # Network Tools
    - role: network_tools
      tags: [tools, network]

    # Database and Container Tools
    - role: database_tools
      tags: [tools, database]

    # Desktop Applications
    - role: desktop_apps
      tags: [tools, desktop]

    # Development Tools (includes work-specific tools like Claude Code)
    - role: development_tools
      tags: [tools, development]

    # Shell Environment - Must be LAST as it integrates all installed tools
    - role: shell_environment
      tags: [config, shell]

  post_tasks:
    - name: Find Ansible backup files to clean up
      ansible.builtin.find:
        paths:
          - "{{ ansible_facts['env']['HOME'] }}"
          - "{{ ansible_facts['env']['HOME'] }}/.ssh"
        patterns:
          # Ansible backup files end with timestamp and ~
          - ".*.[0-9]*.[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]@*~"
          - "*.[0-9]*.[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]@*~"
          # SSH config backups with epoch timestamp
          - "*.backup.[0-9]*"
        hidden: true
      register: backup_files

    - name: Remove backup files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ backup_files.files }}"
      when: backup_files.files | length > 0
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Clean up Homebrew cache
      ansible.builtin.command: brew cleanup -s
      changed_when: false
      failed_when: false

    - name: Gather installed package information
      ansible.builtin.command: brew list --formula
      register: brew_formulas
      changed_when: false
      failed_when: false

    - name: Gather installed cask information
      ansible.builtin.command: brew list --cask
      register: brew_casks
      changed_when: false
      failed_when: false

    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "Workstation Bootstrap Complete!"
          - "=========================================="
          - ""
          - "✓ Cleaned up backup files and caches"
          - ""
          - "Restart your terminal (or run 'source ~/.zshrc')"
