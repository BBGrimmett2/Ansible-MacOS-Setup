---
# =============================================================================
# Install Network Tools Playbook
# =============================================================================
# Purpose: Install network and VPN tools
# Usage: ansible-playbook playbooks/install_network_tools.yml
# =============================================================================

- name: Install Network Tools
  hosts: localhost
  gather_facts: true

  vars_prompt:
    - name: workstation_profile
      prompt: "Select workstation profile (personal/work)"
      private: false

  pre_tasks:
    - name: Load and validate selected profile
      ansible.builtin.import_tasks: tasks/load_profile.yml
      tags: [always]

  roles:
    - role: network_tools
      tags: [network_tools]
