# =============================================================================
# Ansible Configuration for macOS Workstation Automation
# =============================================================================
# This configuration is optimized for local macOS workstation automation.
# All playbooks run against localhost using the 'local' connection.
# =============================================================================

[defaults]

# -----------------------------------------------------------------------------
# Inventory Settings
# -----------------------------------------------------------------------------

# Primary inventory file for local macOS automation
inventory = inventories/localhost.yml

# -----------------------------------------------------------------------------
# Role and Collection Paths
# -----------------------------------------------------------------------------

# Where to find custom roles
roles_path = roles

# Where Galaxy collections are installed (if installing locally)
collections_path = collections

# -----------------------------------------------------------------------------
# Security Settings
# -----------------------------------------------------------------------------

# Secrets are managed via Dashlane CLI (see dashlane_secrets role)
# No Ansible vault configuration needed

# Don't check host keys for localhost (speeds up execution)
host_key_checking = False

# -----------------------------------------------------------------------------
# Performance Settings
# -----------------------------------------------------------------------------

# Disable retry files (they clutter the workspace)
retry_files_enabled = False

# Use internal poll for local connections (faster)
internal_poll_interval = 0.001

# Number of parallel processes (1 for localhost, but future-proofing)
forks = 5

# -----------------------------------------------------------------------------
# Output Settings
# -----------------------------------------------------------------------------

# Use the default callback for consistent output
stdout_callback = default

# Show per-task timing information
callbacks_enabled = timer, profile_tasks

# Don't show skipped hosts
display_skipped_hosts = False

# Show task path in output (helps with debugging)
display_args_to_stdout = False

# Show OK tasks (not just changed)
display_ok_hosts = True

# -----------------------------------------------------------------------------
# Behavior Settings
# -----------------------------------------------------------------------------

# Gathering facts (required for macOS detection and conditionals)
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
# Cache facts for 24 hours
fact_caching_timeout = 86400

# Allow world-readable temp files (localhost only, safe)
allow_world_readable_tmpfiles = True

# Use the YAML callback for better readability
bin_ansible_callbacks = True

# Error handling
any_errors_fatal = False

# -----------------------------------------------------------------------------
# SSH Settings (Not used for localhost, but kept for future remote support)
# -----------------------------------------------------------------------------

[ssh_connection]

# SSH connection settings (not used for local connection)
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
control_path = %(directory)s/%%h-%%r

# -----------------------------------------------------------------------------
# Privilege Escalation
# -----------------------------------------------------------------------------

[privilege_escalation]

# Use sudo for privilege escalation
# Set per-task when needed
become = False
become_method = sudo
become_user = root
# Touch ID configured by pam_security role
become_ask_pass = False

# -----------------------------------------------------------------------------
# Colors
# -----------------------------------------------------------------------------

[colors]

highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
