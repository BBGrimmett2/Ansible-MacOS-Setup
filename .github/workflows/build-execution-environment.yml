---
name: Build Execution Environment

# Intentionally disabled. Keep this workflow for future EE builds.
# Re-enable only after reviewing registry credentials and build requirements.
'on':
  workflow_dispatch:


jobs:
  build:
    if: ${{ false }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-builder
        run: |
          python -m pip install --upgrade pip
          pip install ansible-builder

      - name: Log in to Source Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SOURCE_REGISTRY }}
          username: ${{ secrets.SOURCE_REGISTRY_USERNAME }}
          password: ${{ secrets.SOURCE_REGISTRY_PASSWORD }}

      - name: Log in to Destination Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DEST_REGISTRY }}
          username: ${{ secrets.DEST_REGISTRY_USERNAME }}
          password: ${{ secrets.DEST_REGISTRY_PASSWORD }}

      - name: Generate image tags
        id: tags
        env:
          REPOSITORY: ${{ github.repository }}
          REGISTRY: ${{ secrets.DEST_REGISTRY }}
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          # Convert repository name to lowercase (Docker requirement)
          IMAGE_NAME=$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          # Generate timestamp-based tag
          TIMESTAMP_TAG=$(date -u +%Y%m%d-%H%M%S)

          # Build tag list
          TAGS="${REGISTRY}/${IMAGE_NAME}:latest"
          TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${TIMESTAMP_TAG}"

          # Add custom tag if provided
          if [ -n "${CUSTOM_TAG}" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${CUSTOM_TAG}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "timestamp_tag=${TIMESTAMP_TAG}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build execution environment
        working-directory: execution-environment
        env:
          REGISTRY: ${{ secrets.DEST_REGISTRY }}
          IMAGE_NAME: ${{ steps.tags.outputs.image_name }}
          TIMESTAMP_TAG: ${{ steps.tags.outputs.timestamp_tag }}
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          ansible-builder build \
            --tag "$image:latest" \
            --tag "$image:$TIMESTAMP_TAG" \
            --file execution-environment.yml \
            --container-runtime docker \
            --verbosity 3

      - name: Tag additional versions
        if: inputs.tag != ''
        env:
          REGISTRY: ${{ secrets.DEST_REGISTRY }}
          IMAGE_NAME: ${{ steps.tags.outputs.image_name }}
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          docker tag "$image:latest" "$image:$CUSTOM_TAG"

      - name: Push images to destination registry
        env:
          REGISTRY: ${{ secrets.DEST_REGISTRY }}
          IMAGE_NAME: ${{ steps.tags.outputs.image_name }}
          TIMESTAMP_TAG: ${{ steps.tags.outputs.timestamp_tag }}
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          image="$REGISTRY/$IMAGE_NAME"
          docker push "$image:latest"
          docker push "$image:$TIMESTAMP_TAG"

          if [ -n "$CUSTOM_TAG" ]; then
            docker push "$image:$CUSTOM_TAG"
          fi

      - name: Image summary
        env:
          REGISTRY: ${{ secrets.DEST_REGISTRY }}
          IMAGE_NAME: ${{ steps.tags.outputs.image_name }}
          TIMESTAMP_TAG: ${{ steps.tags.outputs.timestamp_tag }}
          CUSTOM_TAG: ${{ inputs.tag }}
        run: |
          {
            echo "## Execution Environment Build Summary :rocket:"
            echo ""
            echo "**Destination Registry:** $REGISTRY"
            echo "**Image:** $IMAGE_NAME"
            echo ""
            echo "### Tags pushed:"
            printf -- '- `latest`\n- `%s`\n' "$TIMESTAMP_TAG"
            if [ -n "$CUSTOM_TAG" ]; then
              printf -- '- `%s`\n' "$CUSTOM_TAG"
            fi
            echo ""
            echo "**Pull command:**"
            echo '```bash'
            echo "podman pull $REGISTRY/$IMAGE_NAME:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
