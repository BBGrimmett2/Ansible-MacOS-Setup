---
# =============================================================================
# Local macOS Workstation Inventory
# =============================================================================
# This inventory is designed for local workstation automation.
# All automation runs on localhost using the 'local' connection.
# =============================================================================

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_become_method: sudo
      ansible_python_interpreter: auto

  vars:
    # Ansible behavior
    ansible_become_ask_pass: false  # Use Touch ID for sudo (configured by pam_security role)

    # macOS detection
    ansible_os_family: Darwin
