---
# =============================================================================
# Localhost Variables
# =============================================================================
# Override default role variables for localhost execution
# =============================================================================

# -----------------------------------------------------------------------------
# PAM Security
# -----------------------------------------------------------------------------

# Disable Touch ID for sudo (requires sudo password during playbook run)
# Set to true if you want Touch ID and run playbook with --ask-become-pass
pam_touchid_enabled: false

# -----------------------------------------------------------------------------
# Desktop Applications
# -----------------------------------------------------------------------------

# Disable Google Chrome (already installed manually)
desktop_apps_chrome_enabled: false

# Open Google Drive for configuration
desktop_apps_google_drive_configure: true

# -----------------------------------------------------------------------------
# Secrets Configuration
# -----------------------------------------------------------------------------
# Define all secrets, their Dashlane locations, and deployment paths.
# Enable/disable individual secrets as needed.

# SSH Keys Configuration
# Maps SSH keys from Dashlane to local deployment paths
ssh_keys:
  - name: github
    dashlane_secret: ssh_key_github
    file: "{{ ssh_directory }}/id_github"
    host_pattern: "github.com"
    enabled: true

  - name: shadowman
    dashlane_secret: ssh_key_shadowman
    file: "{{ ssh_directory }}/id_shadowman"
    host_pattern: "*.shadowman.dev"
    enabled: true

# SSH Config Deployment Options
# Set to true to deploy complete SSH config from Dashlane instead of using template
ssh_config_from_dashlane: false
ssh_config_dashlane_secret: "ssh_config"  # Dashlane secret name if using Dashlane

# SSH Host Configurations
# Defines SSH config file Host blocks with custom options per environment
# This is used by the template (when ssh_config_from_dashlane is false)
ssh_host_configs:
  # GitHub
  - name: github
    host_pattern: "github.com"
    hostname: "github.com"
    user: git
    identity_file: "~/.ssh/id_github"
    options:
      IdentitiesOnly: "yes"
    enabled: true

  # Shadowman Bastion Host (direct, ProxyJump none prevents *.shadowman.dev wildcard loop)
  - name: shadowman_bastion
    host_pattern: "bastion.shadowman.dev"
    user: bgrimmet
    identity_file: "~/.ssh/id_shadowman"
    proxy_jump: "none"
    options:
      PreferredAuthentications: publickey
      ForwardAgent: "yes"
    enabled: true

  # Shadowman Internal Hosts (via bastion, no VPN required)
  - name: shadowman_internal
    host_pattern: "*.shadowman.dev"
    user: bgrimmet
    identity_file: "~/.ssh/id_shadowman"
    proxy_jump: "bgrimmet@bastion.shadowman.dev"
    options:
      PreferredAuthentications: publickey
      ForwardAgent: "yes"
    enabled: true

# VPN Profiles Configuration
# Maps VPN profiles from Dashlane to local deployment paths
vpn_profiles:
  - name: shadowman
    dashlane_secret: vpn_shadowman_profile
    file: "{{ user_home }}/.vpn/shadowman.ovpn"
    enabled: true

# Certificates Configuration
# Maps certificates from Dashlane to system keychain installation
certificates:                                                                                               
  - name: shadowman_root_ca
    dashlane_secret: cert_shadowman_root_ca
    file: "{{ user_home }}/.certs/shadowman_root_ca.pem"
    keychain_name: "Shadowman"
    enabled: true
    
  - name: shadowman_openshift_root_ca
    dashlane_secret: cert_shadowman_openshift_root_ca
    file: "{{ user_home }}/.certs/openshift_root_ca.pem"
    keychain_name: "OpenShift"
    enabled: true 
