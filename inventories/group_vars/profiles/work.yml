---
# Non-secret work workstation controls. Secret values live in the secret manager.
ssh_keys:
  - name: shadowman
    profile: work
    dashlane_secret: ssh_key_shadowman
    file: "{{ ssh_config_dir }}/id_shadowman"
    enabled: true

ssh_host_configs:
  - name: shadowman_bastion
    profile: work
    host_pattern: bastion.shadowman.dev
    user: "{{ user_name }}"
    identity_file: "~/.ssh/id_shadowman"
    proxy_jump: none
    options:
      PreferredAuthentications: publickey
    enabled: true
  - name: shadowman_internal
    profile: work
    host_pattern: "*.shadowman.dev"
    user: "{{ user_name }}"
    identity_file: "~/.ssh/id_shadowman"
    proxy_jump: "bastion.shadowman.dev"
    options:
      PreferredAuthentications: publickey
    enabled: true

vpn_profiles:
  - name: shadowman
    profile: work
    dashlane_secret: vpn_shadowman_profile
    file: "{{ user_home }}/.vpn/shadowman.ovpn"
    enabled: true

certificates:
  - name: shadowman_root_ca
    profile: work
    dashlane_secret: cert_shadowman_root_ca
    file: "{{ user_home }}/.certs/shadowman_root_ca.pem"
    enabled: true
  - name: shadowman_openshift_root_ca
    profile: work
    dashlane_secret: cert_shadowman_openshift_root_ca
    file: "{{ user_home }}/.certs/openshift_root_ca.pem"
    enabled: true

development_tools_aap_demo_enabled: true
development_tools_mcp_servers: []


# Additional CLI packages for the work profile; appended to common list.
cli_tools_packages_extra: []

# Collaboration software specific to the work profile.
desktop_apps_webex_enabled: true

# Discord developer and community collaboration.
desktop_apps_discord_enabled: true

# Raycast launcher and productivity workflows.
desktop_apps_raycast_enabled: true

# Network diagnostics and VPN client selection.
network_tools_openvpn_enabled: true
network_tools_wireshark_enabled: false

# macOS menu bar system monitoring.
desktop_apps_stats_enabled: true

# Fully managed Dock, in display order. Finder is pinned by macOS.
# Applied after desktop apps are installed.
macos_dock_apps:
  - /Applications/Google Chrome.app
  - /Applications/Visual Studio Code.app
  - /Applications/Cursor.app
  - /Applications/ChatGPT.app
  - /Applications/Webex.app
  - /Applications/Obsidian.app
  - /System/Applications/System Settings.app
